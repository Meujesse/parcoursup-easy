<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ton Carnet de route – Parcoursup'easy</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--rose:rgb(234,31,92);--canard:rgb(18,121,146);--clair:rgb(111,179,195)}
html,body{margin:0;height:100%;font-family:Montserrat,Arial,sans-serif;background:var(--clair);color:#fff}
.page{min-height:100%;display:flex;align-items:center;justify-content:center;padding:32px;box-sizing:border-box}
.carte{background:var(--canard);border-radius:24px;padding:48px 56px;max-width:720px;box-shadow:0 12px 40px rgba(0,0,0,.18);text-align:center}
h1{font-size:40px;margin:0 0 12px;font-weight:800}
h1 span{background:var(--rose);padding:0 10px;border-radius:6px}
p{font-size:20px;line-height:1.5;margin:14px 0}
.tag{display:inline-block;background:var(--rose);border-radius:999px;padding:8px 18px;font-weight:700;margin-top:18px}
.ico{font-size:72px;margin-bottom:10px}
</style></head>
<body><div class="page"><div class="carte">
<div class="ico">🧭</div>
<h1>Ton <span>Carnet de route</span></h1>
<p>Lisa est en train de préparer ton carnet : il t'accompagnera pendant toute l'aventure Parcoursup'easy.</p>
<p>Tu pourras le télécharger ici très bientôt.</p>
<div class="tag">Bientôt disponible</div>
</div></div></body></html>
