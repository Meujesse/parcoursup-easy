<!doctype html><html lang="fr"><head><meta charset="utf-8"><title>Lisa – vidéo</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=Patrick+Hand&display=swap" rel="stylesheet">
<link rel="stylesheet" href="commun.css"><style>
#col{position:absolute;left:40px;top:44px;width:400px}
#col h1{font-size:34px;line-height:1.1}
#col .sous{margin-top:14px;font-size:16px}
#cles{margin-top:22px;display:flex;flex-direction:column;gap:10px}
.cle{background:#fff;border-radius:14px;padding:12px 16px;font:600 15px/1.35 Montserrat,sans-serif;color:var(--encre);box-shadow:0 6px 16px rgba(0,0,0,.12);display:flex;gap:10px;align-items:flex-start;opacity:0;transform:translateY(8px);animation:up .5s forwards}
.cle:nth-child(2){animation-delay:.15s}.cle:nth-child(3){animation-delay:.3s}.cle:nth-child(4){animation-delay:.45s}
.cle b{color:var(--rose);font-size:18px;line-height:1}
@keyframes up{to{opacity:1;transform:none}}
#cadre{position:absolute;left:470px;top:60px;width:690px;height:388px;border-radius:22px;overflow:hidden;box-shadow:0 18px 40px rgba(0,0,0,.28);border:5px solid #fff;background:#0e5d70}
video{width:100%;height:100%;object-fit:cover;display:block}
#play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:104px;height:104px;border-radius:50%;border:5px solid #fff;background:var(--rose);color:#fff;font-size:44px;cursor:pointer;box-shadow:0 12px 30px rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center;padding:0 0 0 7px;transition:transform .15s}
#play:hover{transform:translate(-50%,-50%) scale(1.06)}
#etiq{position:absolute;left:470px;top:466px;width:690px;background:rgba(255,253,247,.94);border-radius:14px;padding:12px 16px;font:500 15px/1.4 Montserrat,sans-serif;color:var(--encre);box-shadow:0 8px 20px rgba(0,0,0,.15)}
#etiq b{color:var(--canard)}
.cache{display:none!important}
body.video #col,body.video #etiq{display:none}
body.video #cadre{left:0;top:0;width:1200px;height:675px;border-radius:0;border:0;box-shadow:none;box-sizing:border-box}
</style></head><body><div id="s">
<div id="col"><h1 id="titre"></h1><div class="sous" id="sous"></div><div id="cles"></div></div>
<div id="cadre"><video id="v" playsinline preload="metadata"></video><button id="play" type="button" aria-label="Lire la vidéo">▶</button></div>
<div id="etiq"></div>
</div>
<script src="commun.js"></script><script>
const P={
 e1:{t:'Bienvenue dans la Première ascension',s:'Découvre les chemins possibles après le lycée, trouve ceux qui te correspondent et construis une stratégie qui te permet d’oser sans tout miser sur une seule possibilité.',c:['Des milliers de formations existent : tu n’as pas besoin de toutes les connaître.','Tu dois savoir repérer celles qui pourraient vraiment te correspondre.','Un même objectif peut souvent être atteint par plusieurs chemins.'],v:'lisa-m2-e1-intro',q:'« Dans cette mission, je vais t’aider à découvrir les différents chemins possibles, y compris certains auxquels tu n’aurais peut-être jamais pensé. »'},
 e8:{t:'Le tableau « Je compare »',s:'Tu as découvert plusieurs chemins. Maintenant, il faut apprendre à les comparer, sans te demander de choisir tout de suite.',c:['Le nom d’une formation ne suffit pas.','Avant de la mettre dans ta liste, tu dois savoir ce que tu vas réellement y trouver.','Les pages suivantes te donnent les huit questions à te poser.'],v:'lisa-m2-e8-compare',q:'« Tu as découvert plusieurs chemins. Maintenant, il faut apprendre à les comparer. »'}
};
const QS=new URLSearchParams(location.search); if(QS.get('mode')==='video') document.body.classList.add('video');
const k=QS.get('e')||'e1'; const d=P[k]||P.e1;
document.title='Lisa – '+d.t; document.getElementById('titre').textContent=d.t; document.getElementById('sous').textContent=d.s;
document.getElementById('cles').innerHTML=d.c.map(x=>'<div class="cle"><b>✓</b><span>'+x+'</span></div>').join('');
const v=document.getElementById('v'),p=document.getElementById('play'),e=document.getElementById('etiq');
v.poster='../video/m2/'+d.v+'-poster.jpg'; v.src='../video/m2/'+d.v+'.mp4'; e.innerHTML='<b>Lisa :</b> '+d.q+' <span style="opacity:.7">Clique sur ▶ pour l’écouter.</span>';
p.onclick=()=>v.play(); v.onplay=()=>p.classList.add('cache'); v.onpause=()=>p.classList.remove('cache');
v.onended=()=>{p.classList.remove('cache'); e.innerHTML='<b>Lisa :</b> '+d.q+' <span style="opacity:.7">Passe à la suite avec la flèche ➜</span>';};
v.onclick=()=>{v.paused?v.play():v.pause();};
</script></body></html>
