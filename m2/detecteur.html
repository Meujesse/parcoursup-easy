<!doctype html><html lang="fr"><head><meta charset="utf-8"><title>Mon détecteur de vigilance – Mission 2</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=Patrick+Hand&display=swap" rel="stylesheet">
<link rel="stylesheet" href="_commun.css"><style>
#tete{position:absolute;left:40px;top:24px;width:800px}
#qs{position:absolute;left:40px;top:120px;width:800px;display:flex;flex-direction:column;gap:10px}
.q{background:#fff;border-radius:14px;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:14px}
.q span{font:600 17px Montserrat,sans-serif;color:var(--encre)}.q span b{display:inline-block;width:30px;height:30px;border-radius:50%;background:var(--canard);color:#fff;text-align:center;line-height:30px;font-size:14px;margin-right:10px}
.q .r{display:flex;gap:6px}.q .r button{border:2px solid #e3eef2;background:#fff;border-radius:999px;padding:7px 16px;font:700 14px Montserrat,sans-serif;cursor:pointer;color:var(--encre)}
.q .r button.oui.on{background:var(--vert);border-color:var(--vert);color:#fff}.q .r button.non.on{background:var(--rose);border-color:var(--rose);color:#fff}
#feu{position:absolute;left:880px;top:120px;width:280px;background:#fff;border-radius:18px;padding:18px;text-align:center;box-shadow:0 12px 30px rgba(0,0,0,.18)}
#feu .lamp{width:70px;height:70px;border-radius:50%;margin:6px auto;background:#e6eef2;transition:.3s}
#feu .lamp.on.v{background:var(--vert);box-shadow:0 0 24px var(--vert)}#feu .lamp.on.o{background:var(--orange);box-shadow:0 0 24px var(--orange)}#feu .lamp.on.r{background:var(--rose);box-shadow:0 0 24px var(--rose)}
#msg{font:600 14px/1.4 Montserrat,sans-serif;color:var(--encre);margin-top:10px;min-height:80px}
#titrefeu{font:800 18px Montserrat,sans-serif;color:var(--canard)}
#lisa{right:30px;height:300px}
</style></head><body><div id="s">
<div id="tete"><h1>🚨 Avant de valider : mon détecteur de vigilance</h1><div class="sous">Pense à la formation que tu as le plus envie de mettre dans ta liste et réponds honnêtement.</div></div>
<div id="qs"></div>
<div id="feu"><div id="titrefeu">Résultat</div><div class="lamp v" id="lv"></div><div class="lamp o" id="lo"></div><div class="lamp r" id="lr"></div><div id="msg">Réponds aux 5 questions pour allumer ton feu.</div></div>
<img class="lisa" id="lisa" alt="">
</div>
<script src="_commun.js"></script><script>
const Q=["Cette formation me plaît-elle vraiment ?","Est-ce que je sais ce que j'y étudierai ?","Est-ce que je sais comment on y entre ?","Est-ce que j'ai vérifié ce qu'il est possible de faire après ?","Ai-je plusieurs chemins possibles vers mon objectif ?"];
let R=PE.get('pe_m2_detecteur',{});
const lisa=document.getElementById('lisa'); lisa.src=LISA+'lisa_11_reflexion.gif';
document.getElementById('qs').innerHTML=Q.map((q,i)=>'<div class="q"><span><b>'+(i+1)+'</b>'+q+'</span><div class="r"><button class="oui" data-i="'+i+'" data-v="1">Oui</button><button class="non" data-i="'+i+'" data-v="0">Pas encore</button></div></div>').join('');
function paint(){ document.querySelectorAll('.q button').forEach(b=>b.classList.toggle('on',R[b.dataset.i]===b.dataset.v)); const n=Object.keys(R).length, oui=Object.values(R).filter(v=>v==='1').length; ['lv','lo','lr'].forEach(id=>document.getElementById(id).classList.remove('on')); const m=document.getElementById('msg'); if(n<5){ m.textContent='Réponds aux 5 questions pour allumer ton feu. ('+n+'/5)'; return; } if(oui===5){ document.getElementById('lv').classList.add('on'); document.getElementById('titrefeu').textContent='🟢 FEU VERT'; m.textContent='Tu as une bonne base. Continue à vérifier les détails avant de valider tes vœux.'; lisa.src=LISA+'lisa_19_pouce-leve.gif'; } else if(oui>=3){ document.getElementById('lo').classList.add('on'); document.getElementById('titrefeu').textContent='🟠 FEU ORANGE'; m.textContent='Certaines pistes méritent encore d\'être vérifiées. Ne te précipite pas.'; lisa.src=LISA+'lisa_24_reflexion-buste.gif'; } else { document.getElementById('lr').classList.add('on'); document.getElementById('titrefeu').textContent='🔴 FEU ROUGE'; m.textContent='Tu as encore trop d\'informations manquantes. Retourne explorer avant de faire tes choix.'; lisa.src=LISA+'lisa_30_perplexite.gif'; } }
document.getElementById('qs').onclick=e=>{ const b=e.target.closest('button'); if(!b) return; R[b.dataset.i]=b.dataset.v; PE.set('pe_m2_detecteur',R); paint(); };
paint();
</script></body></html>
