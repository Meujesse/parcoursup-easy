<!doctype html><html lang="fr"><head><meta charset="utf-8"><title>Choisis tes territoires</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="commun.css"><style>
html,body{background:transparent}
#s{width:900px;height:675px;left:0;top:0;transform:none;position:absolute;touch-action:none}
#carte{position:absolute;left:0;top:0;width:900px;height:506px;overflow:hidden;border-radius:0 0 18px 18px}
#carte img,#carte canvas{position:absolute;left:0;top:0;width:900px;height:506px;display:block}
#glow{pointer-events:none;opacity:0;transition:opacity .25s}
#glow.on{opacity:1}
.nom{position:absolute;transform:translate(-50%,-50%);background:rgba(255,253,247,.95);color:var(--encre);font:800 13px Montserrat,sans-serif;padding:5px 10px;border-radius:999px;box-shadow:0 4px 10px rgba(0,0,0,.2);white-space:nowrap;pointer-events:none}
.pion:not(.pose){animation:bounce 1.6s ease-in-out infinite}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.pion.drag{animation:none}
.pion:not(.pose):after{content:"Glisse-moi sur un territoire";position:absolute;left:-4px;top:100%;margin-top:6px;background:var(--rose);color:#fff;font:800 10px Montserrat,sans-serif;padding:3px 8px;border-radius:999px;white-space:nowrap}
.pion.drag:after{display:none}
#tray{position:absolute;left:0;top:516px;width:900px;height:150px;display:flex;gap:14px;align-items:stretch}
.slot{flex:1;background:rgba(255,253,247,.94);border-radius:14px;padding:10px 12px 10px 86px;position:relative;font:600 13px/1.3 Montserrat,sans-serif;color:var(--encre);box-shadow:0 6px 16px rgba(0,0,0,.15)}
.slot b{display:block;font:800 14px Montserrat,sans-serif;color:var(--rose);margin-bottom:3px}
.slot .res{margin-top:4px;font:700 13px Montserrat,sans-serif;color:var(--canard);min-height:18px}
.pion{position:absolute;width:64px;height:64px;border-radius:50%;background:#fff;border:4px solid var(--rose);box-shadow:0 8px 18px rgba(0,0,0,.28);display:flex;align-items:center;justify-content:center;font-size:30px;cursor:grab;user-select:none;touch-action:none;z-index:5;transition:transform .15s}
.pion.drag{cursor:grabbing;transform:scale(1.12);z-index:9}
.pion.pose{border-color:#fff;background:var(--rose)}
.pion small{position:absolute;left:50%;top:100%;transform:translateX(-50%);margin-top:4px;background:#fff;color:var(--canard);font:800 11px Montserrat,sans-serif;padding:2px 8px;border-radius:999px;white-space:nowrap;box-shadow:0 3px 8px rgba(0,0,0,.2)}
#ok{position:absolute;right:14px;top:470px;display:none}
#msg{position:absolute;left:14px;top:12px;background:rgba(14,93,112,.85);color:#fff;border-radius:12px;padding:8px 14px;font:600 14px Montserrat,sans-serif;max-width:560px}
</style></head><body><div id="s">
<div id="carte"><img id="img" src="img/carte-territoires.jpg" crossorigin="anonymous" alt=""><canvas id="glow" width="900" height="506"></canvas>
<div id="msg">Glisse chaque repère sur un territoire de la carte.</div></div>
<div id="tray">
 <div class="slot" data-k="or"><b>🥇 À explorer absolument</b>Le territoire que tu veux absolument explorer.<div class="res">…</div></div>
 <div class="slot" data-k="argent"><b>🥈 Celui qui t'intrigue</b>Un territoire qui t'intrigue.<div class="res">…</div></div>
 <div class="slot" data-k="loupe"><b>🔍 Celui que tu connais peu</b>Un territoire que tu connaissais peu ou pas.<div class="res">…</div></div>
</div>
<div class="pion" data-k="or" id="p-or">🥇</div><div class="pion" data-k="argent" id="p-argent">🥈</div><div class="pion" data-k="loupe" id="p-loupe">🔍</div>
</div>
<script src="commun.js"></script><script>
const Z={U:{c:[36,108,156],n:'🟦 Université',l:[300,205]},P:{c:[36,156,108],n:'🟩 Formations professionnalisantes',l:[490,180]},C:{c:[204,60,84],n:'🟥 Grandes écoles / commerce',l:[665,235]},I:{c:[204,156,36],n:'🟨 Santé',l:[255,375]},S:{c:[132,84,168],n:'🟪 Prépas',l:[455,330]},R:{c:[228,132,60],n:'🟧 Écoles d’ingénieurs',l:[655,375]}};
for(const k in Z){ const e=document.createElement('div'); e.className='nom'; e.textContent=Z[k].n; e.style.left=Z[k].l[0]+'px'; e.style.top=Z[k].l[1]+'px'; document.getElementById('carte').appendChild(e); }
const HOME={or:[20,540],argent:[318,540],loupe:[616,540]};
let choix=PE.get('pe_m2_territoires',{}), pos=PE.get('pe_m2_territoires_pos',{});
const img=document.getElementById('img'), glow=document.getElementById('glow'), gctx=glow.getContext('2d');
let px=null; // pixel data of the map at 900x506
function prep(){ const c=document.createElement('canvas'); c.width=900; c.height=506; const x=c.getContext('2d'); x.drawImage(img,0,0,900,506); try{ px=x.getImageData(0,0,900,506).data; }catch(e){ px=null; } }
function zoneAt(x,y,wide){ if(!px) return null; x=Math.max(0,Math.min(899,Math.round(x))); y=Math.max(0,Math.min(505,Math.round(y))); const votes={}; const R=wide?36:8, step=wide?6:4;
 for(let dy=-R;dy<=R;dy+=step) for(let dx=-R;dx<=R;dx+=step){ const xx=x+dx,yy=y+dy; if(xx<0||yy<0||xx>=900||yy>=506) continue; const i=(yy*900+xx)*4; const r=px[i],g=px[i+1],b=px[i+2]; let best=null,bd=1e9; for(const k in Z){ const c=Z[k].c; const d=Math.abs(r-c[0])+Math.abs(g-c[1])+Math.abs(b-c[2]); if(d<bd){bd=d;best=k;} } if(bd<80) votes[best]=(votes[best]||0)+1; }
 let bk=null,bn=0; for(const k in votes) if(votes[k]>bn){bn=votes[k];bk=k;} return bk; }
const F=3, LW=300, LH=169; const offc=document.createElement('canvas'); offc.width=LW; offc.height=LH; const octx=offc.getContext('2d'); const masks={};
function near(x,y,c){ const i=(y*900+x)*4; return Math.abs(px[i]-c[0])+Math.abs(px[i+1]-c[1])+Math.abs(px[i+2]-c[2])<80; }
function maskFor(k,sx,sy){ if(masks[k]) return masks[k]; if(!px) return null; const c=Z[k].c; let gx=Math.round(sx/F), gy=Math.round(sy/F); // trouver un pixel de la bonne couleur près du point de départ
 let found=null; for(let r=0;r<=12&&!found;r++){ for(let dy=-r;dy<=r&&!found;dy++) for(let dx=-r;dx<=r&&!found;dx++){ const x=gx+dx,y=gy+dy; if(x<0||y<0||x>=LW||y>=LH) continue; if(near(Math.min(899,x*F),Math.min(505,y*F),c)) found=[x,y]; } }
 if(!found) return null; const m=new Uint8Array(LW*LH); const q=[found[0]+found[1]*LW]; m[q[0]]=1; while(q.length){ const n=q.pop(); const x=n%LW, y=(n-x)/LW; const nb=[[x+1,y],[x-1,y],[x,y+1],[x,y-1]]; for(const [a,b] of nb){ if(a<0||b<0||a>=LW||b>=LH) continue; const id=a+b*LW; if(m[id]) continue; if(near(Math.min(899,a*F),Math.min(505,b*F),c)){ m[id]=1; q.push(id); } } }
 masks[k]=m; return m; }
function highlight(list){ gctx.clearRect(0,0,900,506); if(!px||!list.length){ glow.classList.remove('on'); return; } const img=octx.createImageData(LW,LH); const o=img.data; for(const e of list){ const m=maskFor(e.k,e.seed[0],e.seed[1]); if(!m) continue; const a=e.hover?185:120; for(let i=0;i<m.length;i++){ if(!m[i]) continue; const j=i*4; o[j]=255;o[j+1]=255;o[j+2]=255; if(a>o[j+3]) o[j+3]=a; } } octx.putImageData(img,0,0); gctx.imageSmoothingEnabled=true; gctx.drawImage(offc,0,0,900,506); glow.classList.add('on'); }
function placedList(except){ return Object.keys(choix).filter(k=>choix[k]&&pos[k]&&k!==except).map(k=>({k:choix[k],seed:[pos[k][0]+32,pos[k][1]+32]})); }
function paint(){ const keys=Object.values(choix).filter(Boolean); highlight(placedList()); for(const k in HOME){ const p=document.getElementById('p-'+k); const at=pos[k]||HOME[k]; p.style.left=at[0]+'px'; p.style.top=at[1]+'px'; p.classList.toggle('pose',!!choix[k]); let s=p.querySelector('small'); if(choix[k]){ if(!s){s=document.createElement('small');p.appendChild(s);} s.textContent=Z[choix[k]].n; } else if(s) s.remove(); document.querySelector('.slot[data-k='+k+'] .res').textContent=choix[k]?Z[choix[k]].n:'…'; }
 const n=keys.length; document.getElementById('msg').style.display=n?'block':'none'; document.getElementById('msg').textContent=n===3?'Bravo, tes trois territoires sont posés. Tu peux encore les déplacer.':(n?'Encore '+(3-n)+' repère'+(3-n>1?'s':'')+' à poser.':'Glisse chaque repère sur un territoire de la carte.'); }
img.complete?prep():img.onload=prep;
let drag=null,off=[0,0];
document.querySelectorAll('.pion').forEach(p=>{ p.onpointerdown=e=>{ e.preventDefault(); drag=p; p.classList.add('drag'); p.setPointerCapture(e.pointerId); const r=p.getBoundingClientRect(); const k=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--k'))||1; off=[(e.clientX-r.left),(e.clientY-r.top)]; };
 p.onpointermove=e=>{ if(drag!==p) return; const s=document.getElementById('s').getBoundingClientRect(); const x=(e.clientX-s.left)-off[0], y=(e.clientY-s.top)-off[1]; p.style.left=x+'px'; p.style.top=y+'px'; const z=zoneAt(x+32,y+32)||zoneAt(x+32,y+32,true); const L=placedList(p.dataset.k); if(z) L.push({k:z,seed:[x+32,y+32],hover:true}); highlight(L); };
 p.onpointerup=e=>{ if(drag!==p) return; p.classList.remove('drag'); drag=null; const x=parseFloat(p.style.left), y=parseFloat(p.style.top); const z=zoneAt(x+32,y+32)||zoneAt(x+32,y+32,true); const k=p.dataset.k; if(z){ choix[k]=z; pos[k]=[x,y]; } else { delete choix[k]; delete pos[k]; if(y<480){ const m=document.getElementById('msg'); m.style.display='block'; m.textContent='Pose le repère sur un territoire coloré de la carte.'; setTimeout(paint,1800); return; } } PE.set('pe_m2_territoires',choix); PE.set('pe_m2_territoires_pos',pos); paint(); }; });
paint();
</script></body></html>
