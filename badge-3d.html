<!doctype html>
<html lang="fr"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Badge 3D — Parcoursup'easy</title>
<style>
  html,body{margin:0;padding:0;height:100%;background:transparent;overflow:hidden;
    font-family:Montserrat,"DM Sans",system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
  #c{display:block;width:100vw;height:100vh;cursor:grab;touch-action:none}
  #c.drag{cursor:grabbing}
  #hint{position:fixed;left:0;right:0;bottom:8px;text-align:center;color:rgba(255,255,255,.9);font-size:13px;
    font-weight:600;letter-spacing:.3px;text-shadow:0 2px 6px rgba(8,58,69,.45);
    transition:opacity .6s ease;pointer-events:none}
  #hint.off{opacity:0}
  #bgtest{position:fixed;inset:0;background:#5aa9b8;z-index:-1;display:none}
  body.test #bgtest{display:block}
</style>
</head><body>
<div id="bgtest"></div>
<canvas id="c"></canvas>
<div id="hint">Fais tourner ton badge 👆</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js"></script>
<script>
(function(){
  var P=new URLSearchParams(location.search);
  if(P.get('bg')==='test') document.body.classList.add('test');
  var NAMES={explorateur:'explorateur',chasseur:'chasseur',decrypteur:'decrypteur'};
  var key=NAMES[(P.get('b')||'explorateur').toLowerCase()]||'explorateur';
  var TEX='badges/'+key+'-face.png';
  var TEX_BACK='badges/'+key+'-back.png';

  var PINK=0xea1c5c, PINK_DARK=0xc21a4d;
  var canvas=document.getElementById('c');
  var renderer;
  try{ renderer=new THREE.WebGLRenderer({canvas:canvas,antialias:true,alpha:true}); }catch(e){ renderer=null; }
  if(!renderer || !renderer.getContext()){
    // secours : badge en image plate si la 3D n'est pas disponible
    canvas.style.display='none';
    var img=document.createElement('img');
    img.src='badges/'+key+'-full.png'; img.alt='Badge';
    img.style.cssText='position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);max-width:92%;max-height:92%';
    document.body.appendChild(img);
    var h=document.getElementById('hint'); if(h) h.style.display='none';
    return;
  }
  renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));
  renderer.outputColorSpace=THREE.SRGBColorSpace;
  var scene=new THREE.Scene();
  var camera=new THREE.PerspectiveCamera(34,1,0.1,50);
  camera.position.set(0,0,4.75);

  scene.add(new THREE.HemisphereLight(0xffffff,0x9fd0da,2.1));
  var d1=new THREE.DirectionalLight(0xffffff,2.2); d1.position.set(2.2,2.6,3.4); scene.add(d1);
  var d2=new THREE.DirectionalLight(0xffe8ef,1.0); d2.position.set(-2.8,-1.2,2.0); scene.add(d2);
  var d3=new THREE.DirectionalLight(0xffffff,1.6); d3.position.set(0,1,-3.5); scene.add(d3);

  var group=new THREE.Group(); scene.add(group);

  // --- ruban (derrière la médaille)
  var rib=new THREE.Shape();
  rib.moveTo(-0.42,-0.96); rib.lineTo(-0.42,-1.78); rib.lineTo(-0.15,-1.44);
  rib.lineTo(0,-1.78); rib.lineTo(0.15,-1.44); rib.lineTo(0.42,-1.78);
  rib.lineTo(0.42,-0.96); rib.closePath();
  var ribGeo=new THREE.ExtrudeGeometry(rib,{depth:0.08,bevelEnabled:false});
  ribGeo.translate(0,0,-0.04);
  var ribMesh=new THREE.Mesh(ribGeo,new THREE.MeshStandardMaterial({color:PINK,metalness:0.1,roughness:0.6,emissive:PINK,emissiveIntensity:0.22,side:THREE.DoubleSide}));
  ribMesh.position.set(0,0,-0.10);
  group.add(ribMesh);

  // --- médaille
  var loader=new THREE.TextureLoader();
  function mkTex(rot,flip,src){ var t=loader.load(src||TEX,function(tt){tt.colorSpace=THREE.SRGBColorSpace;});
    t.colorSpace=THREE.SRGBColorSpace; t.anisotropy=8; t.center.set(0.5,0.5); t.rotation=rot;
    if(flip){ t.wrapS=THREE.RepeatWrapping; t.repeat.x=-1; }
    return t; }
  var texF=mkTex(Math.PI/2,false), texB=mkTex(Math.PI/2,false,TEX_BACK);
  function faceMaterial(t){ return new THREE.MeshStandardMaterial({map:t,metalness:0.0,roughness:0.72,
    emissive:0xffffff,emissiveMap:t,emissiveIntensity:0.28}); }
  var faceMat=faceMaterial(texF);
  var backMat=faceMaterial(texB);
  var rimMat=new THREE.MeshStandardMaterial({color:0xd01550,metalness:0.15,roughness:0.55,emissive:0xd01550,emissiveIntensity:0.2});
  var disc=new THREE.Mesh(new THREE.CylinderGeometry(1,1,0.075,96,1,false),[rimMat,faceMat,backMat]);
  disc.rotation.x=Math.PI/2;
  group.add(disc);
  group.position.y=0.36;

  // --- interaction
  var rotY=0, angVel=0, dragging=false, lastX=0, lastY=0, tiltTarget=0, tilt=0, idle=0;
  var hint=document.getElementById('hint'), hintOff=false;
  function off(){ if(!hintOff){ hintOff=true; hint.classList.add('off'); } }
  canvas.addEventListener('pointerdown',function(e){ dragging=true; idle=0; lastX=e.clientX; lastY=e.clientY;
    canvas.classList.add('drag'); canvas.setPointerCapture(e.pointerId); off(); });
  canvas.addEventListener('pointermove',function(e){ if(!dragging) return;
    var dx=e.clientX-lastX, dy=e.clientY-lastY; lastX=e.clientX; lastY=e.clientY;
    rotY+=dx*0.013; angVel=dx*0.013;
    tiltTarget=Math.max(-0.22,Math.min(0.22,tiltTarget+dy*0.005)); });
  function end(){ dragging=false; canvas.classList.remove('drag'); }
  canvas.addEventListener('pointerup',end); canvas.addEventListener('pointercancel',end);

  function resize(){ var w=innerWidth,h=innerHeight; renderer.setSize(w,h,false);
    camera.aspect=w/h;
    // on garde toujours la medaille entiere dans le cadre, meme en format non carre
    var need=3.15;                       // hauteur occupee par la medaille + le ruban
    var fovV=2*Math.atan((need/2)/4.75)*180/Math.PI;
    if(camera.aspect<1){ fovV=2*Math.atan((need/2)/(4.75*camera.aspect))*180/Math.PI; }
    camera.fov=Math.min(60,fovV); camera.updateProjectionMatrix(); }
  addEventListener('resize',resize); resize();

  var t0=performance.now();
  (function loop(now){
    var dt=Math.min(40,now-t0)/16.67; t0=now;
    if(dragging){ idle=0; }
    else {
      idle+=dt;
      angVel*=0.94;                                  // inertie apres le glisser
      rotY+=angVel*dt;
      if(Math.abs(angVel)<0.004){                    // puis retour face au lecteur
        var sway=Math.sin(now/3000)*0.16;
        var diff=Math.atan2(Math.sin(sway-rotY),Math.cos(sway-rotY));
        rotY+=diff*Math.min(0.09,0.03*dt);
      }
      tiltTarget+=(0-tiltTarget)*0.02*dt;
    }
    tilt+=(tiltTarget-tilt)*0.1*dt;
    group.rotation.y=rotY;
    group.rotation.x=tilt;
    renderer.render(scene,camera);
    requestAnimationFrame(loop);
  })(performance.now());
  setTimeout(off,5000);
})();
</script>
</body></html>
