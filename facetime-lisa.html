<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Appel avec Lisa</title>
<style>
/* ============================================================
   Simulation d'appel vidéo avec Lisa — module 1 (version 16:9).
   Fenêtre d'appel plein cadre, vidéos Higgsfield 16:9 (Kling Avatars),
   choix qui apparaissent en surimpression façon bulles d'appel.
   ============================================================ */
:root{
  --rose:#ea1f5c; --vert:#34c759; --rouge:#ff3b30;
  --verre:rgba(255,255,255,.14);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#0b0b0d;overflow:hidden;
  font-family:"Montserrat",system-ui,-apple-system,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased}

#scene{position:fixed;inset:0;display:grid;place-items:center}
#ecran{position:relative;width:min(100vw,calc(100vh * 16 / 9));
  aspect-ratio:16/9;background:#000;border-radius:clamp(10px,1.6vw,22px);overflow:hidden;
  box-shadow:0 30px 80px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.08)}

video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#1c1c1e}

/* ---------- écran d'appel entrant ---------- */
#entrant{position:absolute;inset:0;z-index:40;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:0;
  background:linear-gradient(160deg,#3a3a4a,#1c1c26);
  opacity:1;transition:opacity .5s}
#entrant.parti{opacity:0;pointer-events:none}
#entrant .avatar{width:clamp(90px,16vh,150px);height:clamp(90px,16vh,150px);border-radius:50%;
  background:#2c2c34 center/cover;box-shadow:0 10px 30px rgba(0,0,0,.4);
  border:3px solid rgba(255,255,255,.15);margin-bottom:2.2vh;margin-top:-8vh}
#entrant .nom{color:#fff;font-size:clamp(22px,4vh,34px);font-weight:600}
#entrant .sous{color:rgba(255,255,255,.6);font-size:clamp(13px,2vh,17px);margin-top:.8vh;
  animation:clignote 1.6s ease-in-out infinite}
@keyframes clignote{0%,100%{opacity:.6}50%{opacity:1}}
#entrant .boutons{position:absolute;bottom:13vh;left:50%;translate:-50% 0;
  display:flex;gap:clamp(60px,14vw,180px)}
.rond{width:clamp(54px,9vh,72px);height:clamp(54px,9vh,72px);border-radius:50%;border:none;cursor:pointer;
  display:grid;place-items:center;transition:transform .2s}
.rond:hover{transform:scale(1.08)}
.rond.raccrocher{background:var(--rouge)}
.rond.decrocher{background:var(--vert);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(52,199,89,.5)}
  50%{box-shadow:0 0 0 14px rgba(52,199,89,0)}}
.rond svg{width:40%;height:40%}
.etiq{position:absolute;left:50%;top:calc(100% + 1vh);translate:-50% 0;
  color:rgba(255,255,255,.75);font-size:clamp(11px,1.7vh,13px);white-space:nowrap}

/* ---------- barre d'appel en cours (haut) ---------- */
#barre{position:absolute;top:0;left:0;right:0;z-index:30;padding:2.4vh 2.4vw 5vh;
  display:flex;flex-direction:column;align-items:flex-start;color:#fff;
  background:linear-gradient(rgba(0,0,0,.55),transparent);
  opacity:0;transition:opacity .4s;pointer-events:none}
#barre.vu{opacity:1}
#barre .nom{font-size:clamp(15px,2.6vh,21px);font-weight:600}
#barre .chrono{font-size:clamp(11px,1.8vh,14px);color:rgba(255,255,255,.75);margin-top:2px;
  font-variant-numeric:tabular-nums}

/* ---------- PIP (vue de l'apprenant, factice) ---------- */
#pip{position:absolute;top:2.4vh;right:1.6vw;width:clamp(96px,16vw,190px);aspect-ratio:16/10;
  border-radius:clamp(8px,1.4vh,14px);
  background:linear-gradient(160deg,#2a2a32,#111114);z-index:30;
  box-shadow:0 6px 18px rgba(0,0,0,.4);display:grid;place-items:center;
  opacity:0;transition:opacity .4s}
#pip.vu{opacity:1}
#pip svg{width:32%;height:32%;opacity:.35}

/* ---------- bulle de texte (repli si une vidéo manque) ---------- */
#bulleTexte{position:absolute;left:3vw;right:3vw;bottom:19vh;z-index:32;
  background:rgba(255,255,255,.96);color:#1c1c1e;border-radius:20px;padding:2vh 2vw;
  font-size:clamp(14px,2.3vh,19px);font-weight:600;line-height:1.4;box-shadow:0 14px 34px rgba(0,0,0,.35);
  opacity:0;transform:translateY(14px);transition:opacity .35s,transform .35s}
#bulleTexte.vu{opacity:1;transform:none}

/* ---------- choix ---------- */
#choix{position:absolute;left:3vw;right:3vw;bottom:14vh;z-index:35;
  display:flex;justify-content:center;gap:1.6vw;opacity:0;pointer-events:none;
  transition:opacity .35s}
#choix.vu{opacity:1;pointer-events:auto}
.rep{font-family:inherit;font-size:clamp(14px,2.3vh,19px);font-weight:700;color:#fff;text-align:center;
  flex:0 1 46%;
  background:var(--verre);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border:1px solid rgba(255,255,255,.28);border-radius:18px;padding:1.8vh 1.6vw;cursor:pointer;
  animation:arrivee .4s cubic-bezier(.3,1.4,.5,1) both}
#choix .rep:nth-child(2){animation-delay:.1s}
@keyframes arrivee{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.rep:hover,.rep:active{background:rgba(234,31,92,.85);border-color:transparent}
.rep.elue{background:var(--rose);border-color:transparent}
.rep.efface{opacity:0}

/* ---------- contrôles bas d'appel ---------- */
/* Barre d'outils opaque façon FaceTime : elle masque aussi le bandeau
   parasite que Kling ajoute en bas de certains clips (V4). */
#controles{position:absolute;bottom:0;left:0;right:0;z-index:30;height:13.5%;
  display:flex;justify-content:center;align-items:center;gap:2vw;
  background:rgba(14,14,18,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-top:1px solid rgba(255,255,255,.08);
  opacity:0;transition:opacity .4s;pointer-events:none}
#controles.vu{opacity:1;pointer-events:auto}
.mini{width:clamp(40px,7vh,54px);height:clamp(40px,7vh,54px);border-radius:50%;border:none;background:var(--verre);
  backdrop-filter:blur(10px);display:grid;place-items:center;cursor:default}
.mini svg{width:42%;height:42%;stroke:#fff}
#raccrocherAppel{width:clamp(46px,8vh,62px);height:clamp(46px,8vh,62px);border-radius:50%;border:none;background:var(--rouge);
  display:grid;place-items:center;cursor:pointer;transition:transform .2s}
#raccrocherAppel:hover{transform:scale(1.06)}
#raccrocherAppel svg{width:42%;height:42%}

/* ---------- fin d'appel ---------- */
#fin{position:absolute;inset:0;z-index:45;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:1.8vh;color:#fff;text-align:center;
  background:rgba(10,10,12,.92);opacity:0;pointer-events:none;transition:opacity .5s}
#fin.vu{opacity:1;pointer-events:auto}
#fin .avatar{width:clamp(80px,14vh,120px);height:clamp(80px,14vh,120px);border-radius:50%;background:#2c2c34 center/cover;
  border:3px solid rgba(255,255,255,.15)}
#fin h1{font-size:clamp(18px,3.2vh,26px);font-weight:600}
#fin p{font-size:clamp(12px,2vh,15px);color:rgba(255,255,255,.6);max-width:320px}
#revoir{margin-top:.8vh;font-family:inherit;font-size:clamp(12px,2vh,15px);font-weight:700;color:#fff;
  background:var(--verre);border:1px solid rgba(255,255,255,.28);border-radius:999px;
  padding:1.4vh 2.6vw;cursor:pointer}
#revoir:hover{background:rgba(255,255,255,.22)}
</style>
</head>
<body>
<div id="scene"><div id="ecran">

  <video id="vid" playsinline preload="auto" poster="facetime-lisa-poster.png"></video>

  <div id="entrant">
    <div class="avatar" style="background-image:url('facetime-lisa-avatar.png')"></div>
    <div class="nom">Lisa</div>
    <div class="sous">Appel vidéo…</div>
    <div class="boutons">
      <div style="position:relative">
        <button class="rond raccrocher" id="refuser" aria-label="Refuser">
          <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><path d="M4 15 Q12 5 20 15" /><path d="M4 15 L8 15 L8 19" /><path d="M20 15 L16 15 L16 19" /></svg>
        </button>
        <div class="etiq">Refuser</div>
      </div>
      <div style="position:relative">
        <button class="rond decrocher" id="accepter" aria-label="Décrocher">
          <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4c0 9 7 16 16 16l1-4-5-2-2 2c-3-1-5-3-6-6l2-2-2-5z"/></svg>
        </button>
        <div class="etiq">Accepter</div>
      </div>
    </div>
  </div>

  <div id="barre"><div class="nom">Lisa</div><div class="chrono" id="chrono">00:00</div></div>

  <div id="pip"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg></div>

  <div id="bulleTexte"></div>
  <div id="choix"></div>

  <div id="controles">
    <div class="mini"><svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2M12 19v4"/></svg></div>
    <button id="raccrocherAppel" aria-label="Raccrocher">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><path d="M4 15 Q12 5 20 15" /><path d="M4 15 L8 15 L8 19" /><path d="M20 15 L16 15 L16 19" /></svg>
    </button>
    <div class="mini"><svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="14" height="12" rx="2"/><path d="M21 8l-4 3 4 3z"/></svg></div>
  </div>

  <div id="fin">
    <div class="avatar" style="background-image:url('facetime-lisa-avatar.png')"></div>
    <h1>Appel terminé</h1>
    <p id="finDuree">Durée : 0:00</p>
    <button id="revoir">Rappeler Lisa</button>
  </div>
</div></div>

<script>
const $ = s => document.querySelector(s);
const vid = $('#vid');

/* Arbre : V1 → choix 1 (A/B) → V2a/V2b → choix 2 (C/D) → V3a/V3b → V4 (commune) */
const ARBRE = {
  v1:  { src: 'facetime-lisa-v1.mp4',
         choix: [
           { texte: "Quoi ? Autant que ça ?!",         suite: 'v2a' },
           { texte: "Ouais, on m'en avait déjà parlé.", suite: 'v2b' },
         ] },
  v2a: { src: 'facetime-lisa-v2a.mp4', choix: 'choix2' },
  v2b: { src: 'facetime-lisa-v2b.mp4', choix: 'choix2' },
  v3a: { src: 'facetime-lisa-v3a.mp4', suite: 'v4' },
  v3b: { src: 'facetime-lisa-v3b.mp4', suite: 'v4' },
  v4:  { src: 'facetime-lisa-v4.mp4', fin: true },
};
const CHOIX2 = [
  { texte: "Et concrètement, on fait comment ?", suite: 'v3a' },
  { texte: "Ça, c'est encore flou pour moi…",    suite: 'v3b' },
];

let debut = null, chronoId = null;

function formate(s){
  const m = Math.floor(s / 60), r = Math.floor(s % 60);
  return String(m).padStart(2,'0') + ':' + String(r).padStart(2,'0');
}
function lanceChrono(){
  debut = Date.now();
  chronoId = setInterval(() => {
    $('#chrono').textContent = formate((Date.now() - debut) / 1000);
  }, 500);
}

/* Préchargement discret des clips pour éviter les blancs entre deux répliques */
for(const k in ARBRE){ const l = document.createElement('link'); l.rel = 'preload'; l.as = 'video'; l.href = ARBRE[k].src; document.head.appendChild(l); }

$('#accepter').addEventListener('click', () => {
  $('#entrant').classList.add('parti');
  $('#barre').classList.add('vu');
  $('#pip').classList.add('vu');
  $('#controles').classList.add('vu');
  lanceChrono();
  joue('v1');
});

function joue(cle){
  const e = ARBRE[cle];
  if(e.texte){ montreTexte(e); return; }
  vid.src = e.src;
  vid.currentTime = 0;
  vid.play();
  vid.onended = () => {
    if(e.choix === 'choix2') proposeChoix(CHOIX2);
    else if(e.choix) proposeChoix(e.choix);
    else if(e.fin) termine();
    else if(e.suite) joue(e.suite);
  };
}

function montreTexte(e){
  const b = $('#bulleTexte');
  b.textContent = e.texte;
  b.classList.add('vu');
  setTimeout(() => {
    b.classList.remove('vu');
    setTimeout(() => joue(e.suite), 400);
  }, 4200);
}

function proposeChoix(options){
  const c = $('#choix');
  c.innerHTML = '';
  for(const o of options){
    const b = document.createElement('button');
    b.className = 'rep';
    b.textContent = o.texte;
    b.onclick = () => {
      for(const x of c.children) x.classList.add(x === b ? 'elue' : 'efface');
      setTimeout(() => { c.classList.remove('vu'); joue(o.suite); }, 550);
    };
    c.appendChild(b);
  }
  c.classList.add('vu');
}

function termine(){
  clearInterval(chronoId);
  $('#finDuree').textContent = 'Durée : ' + formate((Date.now() - debut) / 1000);
  $('#barre').classList.remove('vu');
  $('#pip').classList.remove('vu');
  $('#controles').classList.remove('vu');
  $('#fin').classList.add('vu');
}

$('#raccrocherAppel').addEventListener('click', termine);
$('#refuser').addEventListener('click', () => { $('#entrant .sous').textContent = 'Appel refusé'; });

$('#revoir').addEventListener('click', () => {
  $('#fin').classList.remove('vu');
  $('#entrant').classList.remove('parti');
  $('#entrant .sous').textContent = 'Appel vidéo…';
  vid.pause(); vid.removeAttribute('src');
  $('#chrono').textContent = '00:00';
});
</script>
</body>
</html>
