/* ============================================================
   Les paliers, les textes et l'exemple de Lisa sont dans le
   bloc <script id="config"> en bas de page.
   ============================================================ */
:root{
  --teal:#127992; --teal-clair:#6fb3c3; --rose:#ea1f5c; --violet:#7c7baa;
  --rose-pastille:#ee1552; --halo-pastille:#c1d4de;
  --blanc:#ffffff;
  --fond:var(--teal-clair);
  --bulle-fond:#f8f8f8;
  --sur-fond:#083a45;
  --halo:#e0e2eb;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--fond);
  font-family:"Montserrat",system-ui,-apple-system,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased}

#fit{position:fixed;inset:0;display:grid;place-items:center;overflow:hidden}
#cadre{position:relative}
#stage{width:1600px;height:900px;position:absolute;top:0;left:0;
  transform-origin:top left;background:var(--fond);overflow:hidden}

/* ---------- titre ---------- */
.titre{position:absolute;left:70px;top:52px;color:var(--blanc);z-index:5}
.titre h1{font-size:68px;font-weight:800;line-height:.95;letter-spacing:-1px;
  text-shadow:0 3px 0 rgba(8,58,69,.32)}
.titre p{font-size:29px;font-weight:600;margin-top:14px;max-width:655px;line-height:1.22;
  text-shadow:0 2px 0 rgba(8,58,69,.22)}

/* ============================================================
   LE PANNEAU DU CURSEUR
   Tout est place au pixel par le script a partir d'une seule
   grille (objet GRILLE), multipliee par un facteur d'echelle :
   1 pour l'activite comme pour la fenetre Exemple, qui a desormais
   la meme taille.
   Un seul jeu de coordonnees, donc jamais deux mises en page a
   maintenir en parallele.
   ============================================================ */
#panneau{position:absolute;left:70px;top:296px;z-index:4}
.panneau{position:relative;
  background:linear-gradient(170deg,#1a8ba6 0%,#127992 55%,#0d6a81 100%);
  border-radius:26px;box-shadow:0 18px 44px rgba(8,52,64,.34),
  inset 0 1px 0 rgba(255,255,255,.16)}

/* --- un jalon : l'icone, sa tige, sa pastille rose, son infobulle --- */
.jalon{position:absolute;display:grid;place-items:center;cursor:pointer;
  -webkit-tap-highlight-color:transparent}
/* --proche vaut 1 sur l'icone que vise le curseur et retombe a 0 des
   qu'on s'en eloigne d'un cran. L'attention suit donc la main en continu,
   au lieu de basculer d'un coup : c'est ce degrade qui donne au curseur
   sa sensation de poids. Il est pose par le script a chaque image. */
.jalon .ico{width:100%;height:100%;display:block;overflow:visible;
  opacity:calc(.5 + var(--proche,0) * .5);
  transform:scale(calc(.9 + var(--proche,0) * .2));
  transform-origin:50% 60%;
  transition:filter .3s ease}
.jalon .ico path,.jalon .ico circle,.jalon .ico rect,.jalon .ico line,
.jalon .ico ellipse{fill:none;stroke:#fff;stroke-width:3.1;
  stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.jalon:hover .ico{opacity:1}
.jalon:focus{outline:none}
.jalon:focus-visible{border-radius:14px;
  box-shadow:0 0 0 3px rgba(255,255,255,.95),0 0 0 7px rgba(234,31,92,.55)}
.jalon.actif .ico{filter:drop-shadow(0 6px 14px rgba(0,0,0,.35))}
.jalon.actif .ico path,.jalon.actif .ico circle,.jalon.actif .ico rect,
.jalon.actif .ico line,.jalon.actif .ico ellipse{stroke-width:3.6}
/* L'arc de duree est la vraie information de la Question 6 : epais, bouts
   ronds, il se lit avant l'horloge. L'anneau de fond reste discret : il
   sert de reference, pas de dessin. */
.jalon .ico .jauge{stroke-width:5;stroke-linecap:round}
.jalon.actif .ico .jauge{stroke-width:5.6}
.jalon .ico .piste{stroke-width:5;stroke-opacity:.22}

/* la tige qui relie l'icone a la barre */
.tige{position:absolute;border-radius:2px;
  background:rgba(255,255,255,calc(.26 + var(--proche,0) * .64));
  transition:box-shadow .3s ease}
.tige.actif{background:#fff;box-shadow:0 0 12px rgba(255,255,255,.7)}

/* --- la pastille rose : le SVG d'origine, halo compris --- */
.pastille{display:block;overflow:visible}
.pastille .halo{fill:var(--halo);opacity:.8;transform-box:fill-box;
  transform-origin:center;animation:battement 2.4s ease-in-out infinite}
.pastille .disq{fill:var(--rose)}
.pastille .main{fill:#fff}
@keyframes battement{0%,100%{transform:scale(.8);opacity:.85}
                     55%    {transform:scale(1);opacity:.22}}
.jalon .pastille{position:absolute;pointer-events:none}
.jalon:hover .pastille .halo{animation-duration:1.1s}

/* --- l'infobulle : meme contenu, meme geste que dans le Genially --- */
.info{position:absolute;left:50%;bottom:100%;transform:translate(-50%,-6px) scale(.94);
  background:#fff;color:#0e0e0e;border-radius:14px;text-align:center;
  font-weight:600;line-height:1.32;box-shadow:0 14px 32px rgba(4,32,42,.34);
  opacity:0;pointer-events:none;z-index:14;
  transition:opacity .22s ease,transform .3s cubic-bezier(.34,1.5,.5,1)}
.info::after{content:"";position:absolute;left:50%;top:100%;
  border:9px solid transparent;border-top-color:#fff;
  transform:translateX(-50%);margin-top:-1px}
.jalon:hover .info,.jalon:focus-visible .info,.jalon.montre .info{
  opacity:1;transform:translate(-50%,0) scale(1)}

/* --- la barre --- */
.rail{position:absolute;background:rgba(255,255,255,.26);border-radius:999px;
  box-shadow:inset 0 2px 5px rgba(0,0,0,.22)}
.remp{position:absolute;left:0;top:0;bottom:0;border-radius:999px;
  background:linear-gradient(90deg,#8ee3f2 0%,#3fc8dd 34%,#ff7aa5 78%,var(--rose) 100%);
  background-size:var(--plein) 100%;background-repeat:no-repeat;
  box-shadow:0 0 18px rgba(255,255,255,.28)}
.crans{position:absolute;left:0;right:0;top:0;bottom:0;pointer-events:none}
.cran{position:absolute;border-radius:50%;background:rgba(255,255,255,.55);
  transform:translate(-50%,-50%);transition:background .3s,transform .35s}
.cran.passe{background:#fff}
.zone{position:absolute;cursor:grab;touch-action:none}
.zone:active{cursor:grabbing}
.lecture .zone{cursor:default;pointer-events:none}
.lecture .jalon{cursor:default}

/* --- la poignee --- */
/* Une poignee qui reste parfaitement droite pendant qu'on la traine
   parait collee a la barre. Un leger basculement dans le sens du
   mouvement, qui revient a plat au relachement, suffit a lui donner de
   l'inertie. */
.poig{position:absolute;background:#fff;border-radius:999px;
  box-shadow:0 8px 20px rgba(4,34,44,.42),0 0 0 3px rgba(255,255,255,.28);
  display:grid;place-items:center;gap:3px;
  transform:rotate(var(--incl,0deg)) scale(var(--ech,1));
  transition:box-shadow .22s ease,transform .3s cubic-bezier(.3,1.5,.5,1)}
.poig i{display:block;background:#9fc3ce;border-radius:2px}
.poig:focus-visible{outline:none;box-shadow:0 8px 20px rgba(4,34,44,.42),
  0 0 0 5px rgba(255,255,255,.95),0 0 0 9px rgba(234,31,92,.55)}
.zone.prise .poig{--ech:1.09;transition:transform .08s linear,box-shadow .22s;
  box-shadow:0 14px 30px rgba(4,34,44,.5),0 0 0 5px rgba(255,255,255,.4)}
/* avant le premier geste, la poignee respire pour dire « attrape-moi » */
@keyframes invite{0%,100%{box-shadow:0 8px 20px rgba(4,34,44,.42),
                    0 0 0 0 rgba(255,255,255,.55)}
                  60%    {box-shadow:0 8px 20px rgba(4,34,44,.42),
                    0 0 0 16px rgba(255,255,255,0)}}
.panneau.vierge .poig{animation:invite 1.9s ease-in-out infinite}

/* --- l'etiquette qui suit la poignee --- */
.etiq{position:absolute;left:0;background:#fff;color:var(--teal);
  font-weight:800;white-space:nowrap;border-radius:999px;
  box-shadow:0 10px 24px rgba(4,34,44,.3);
  transform:translateX(-50%);text-align:center;
  display:flex;flex-direction:column;justify-content:center;align-items:center;
  transition:left .34s cubic-bezier(.3,1.3,.5,1)}
/* Deuxieme ligne : le palier traduit en temps de trajet. Le choix devient
   concret — « rentrer tous les week-ends », c'est 2 a 3 h de train, et
   c'est ca qui pese vraiment dans une liste de voeux. */
.etiq .rep{font-weight:600;color:#5d8896;letter-spacing:.1px}
.etiq.vierge{background:rgba(255,255,255,.16);color:#eaf7fb;font-weight:700;
  box-shadow:none}
.etiq.vierge .rep{display:none}
.panneau .bornes{position:absolute;left:0;right:0;display:flex;
  justify-content:space-between;color:rgba(255,255,255,.82);font-weight:700}

/* ---------- boutons d'action ---------- */
#actions{position:absolute;left:70px;width:880px;top:762px;z-index:8;
  display:flex;justify-content:flex-end;align-items:center;gap:16px}
#btnValider{font-size:20px;font-weight:700;padding:12px 28px;

  animation:halo 2.3s ease-in-out infinite}
#btnValider.pret:hover{background:var(--rose);box-shadow:0 13px 28px rgba(234,31,92,.52)}
@keyframes halo{
  0%,100%{box-shadow:0 8px 20px rgba(234,31,92,.42),0 0 0 0 rgba(234,31,92,.42)}
  55%    {box-shadow:0 8px 20px rgba(234,31,92,.42),0 0 0 12px rgba(234,31,92,0)}}

  font:inherit;font-size:20px;font-weight:700;color:var(--teal);border-radius:999px;
  padding:11px 26px;box-shadow:0 6px 16px rgba(9,58,72,.16);

#btnRejouer.vu{display:inline-block;animation:apparait .45s ease .15s both}
@keyframes apparait{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
#btnRejouer:hover{background:#fff;transform:translateY(-2px);
  box-shadow:0 12px 24px rgba(9,58,72,.24)}

/* ---------- Lisa vivante, plein pied -------------------------------
   Trois couches sur la même image (une seule fois en base64, partagée
   par variable CSS). Les masques sont complémentaires : là où l'une
   s'efface, l'autre apparaît, donc jamais de double rendu.
     jambes  fixes        buste  respire        tete  dérive          */
/* Le calque occupe toute la scene et chaque pose y est placee par la
   colonne de son cou, jamais par le bord droit. Deux poses de largeurs
   differentes — la valise et son bagage, le signe V tout en hauteur —
   restaient sinon calees a droite, et Lisa semblait glisser vers le bord
   de la page a chaque changement. */
#lisa{position:absolute;left:0;right:0;bottom:0;height:862px;z-index:3;
  pointer-events:none;filter:drop-shadow(0 18px 34px rgba(9,58,72,.24))}
.pose{position:absolute;bottom:0;height:862px;opacity:0;
  transform:scale(.985);
  transition:opacity .45s ease,transform .55s cubic-bezier(.34,1.3,.5,1);
  transform-origin:var(--appui) 100%}
.pose.vu{opacity:1;transform:none;animation:appui 11.3s ease-in-out infinite alternate}
.c{position:absolute;inset:0;background:var(--img) no-repeat center/100% 100%}

.jambes{-webkit-mask-image:linear-gradient(to top,#000 calc(var(--taille) - 34px),
                                           transparent calc(var(--taille) + 34px));
        mask-image:linear-gradient(to top,#000 calc(var(--taille) - 34px),
                                   transparent calc(var(--taille) + 34px))}
.buste{-webkit-mask-image:linear-gradient(to top,
   transparent calc(var(--taille) - 34px), #000 calc(var(--taille) + 34px),
   #000 calc(var(--nuque) - 26px), transparent calc(var(--nuque) + 26px));
       mask-image:linear-gradient(to top,
   transparent calc(var(--taille) - 34px), #000 calc(var(--taille) + 34px),
   #000 calc(var(--nuque) - 26px), transparent calc(var(--nuque) + 26px));
  transform-origin:50% calc(100% - var(--taille));
  animation:souffle 4.6s ease-in-out infinite}
.paup{position:absolute;opacity:0;pointer-events:none;
  background-repeat:no-repeat;background-size:100% 100%}
.tete{-webkit-mask-image:linear-gradient(to top,
   transparent calc(var(--nuque) - 26px), #000 calc(var(--nuque) + 26px));
      mask-image:linear-gradient(to top,
   transparent calc(var(--nuque) - 26px), #000 calc(var(--nuque) + 26px));
  transform-origin:50% calc(100% - var(--nuque));
  animation:derive 7.3s ease-in-out infinite alternate}

@keyframes appui{from{transform:rotate(-.17deg)} to{transform:rotate(.19deg)}}
@keyframes souffle{0%{transform:scale(1,1)}38%{transform:scale(1.0035,1.007)}
                   100%{transform:scale(1,1)}}
@keyframes derive{from{transform:rotate(-.45deg) translateY(.6px)}
                  to  {transform:rotate(.5deg) translateY(-.5px)}}
@media (prefers-reduced-motion: reduce){
  .pose.vu,.buste,.tete,.pastille .halo,.panneau.vierge .poig{animation:none}
}
body.figee .pose.vu,body.figee .buste,body.figee .tete{animation:none}

/* ---------- bulle ---------- */
.bulle{position:absolute;background:var(--bulle-fond);border:2.5px solid var(--teal);
  border-radius:20px;padding:20px 24px;color:#16323c;font-size:24px;line-height:1.36;
  box-shadow:0 12px 30px rgba(9,58,72,.2)}
.bulle b{color:var(--teal);font-weight:700}
.bulle i{font-style:italic}
.bulle::after,.bulle::before{content:"";position:absolute;width:0;height:0;border-style:solid}
.bulle.droite::before{right:-26px;bottom:30px;border-width:14px 0 14px 26px;
  border-color:transparent transparent transparent var(--teal)}
.bulle.droite::after{right:-21px;bottom:34px;border-width:11px 0 11px 21px;
  border-color:transparent transparent transparent var(--bulle-fond)}

#bulleLisa{right:430px;bottom:648px;width:400px;z-index:6;

/* Pendant qu'on lit une infobulle, la consigne s'efface : les deux se
   chevauchent forcement quand le texte du palier fait trois lignes, et de
   toute facon on ne lit pas les deux en meme temps. */
#bulleLisa.recule{opacity:.16}

/* ---------- bouton Exemple ----------------------------------------
   La pastille est le symbole d'origine de la cliente : il est presente
   en debut de module dans la legende des boutons, donc il ne change pas.
   Seul l'habillage du bouton est harmonise avec les autres activites. */
.btn{font-size:21px;font-weight:700;letter-spacing:.2px;color:var(--blanc);
  background:var(--rose);border:none;border-radius:999px;
  padding:12px 24px 12px 28px;cursor:pointer;font-family:inherit;
  box-shadow:0 8px 20px rgba(234,31,92,.42);display:inline-flex;align-items:center;gap:6px;
  transition:transform .22s cubic-bezier(.34,1.5,.5,1),box-shadow .22s,background .22s}
.btn:hover{transform:translateY(-3px) scale(1.035);box-shadow:0 13px 28px rgba(234,31,92,.52)}
.btn:active{transform:translateY(0) scale(.99)}
.btn .pastille{width:52px;height:52px;margin:-14px -26px -14px 5px;flex:0 0 52px}
#btnExemple{position:absolute;right:424px;top:356px;z-index:7}

/* Au moment de valider, un point part de la maison et file jusqu'au
   palier choisi : le trajet que l'eleve vient de decrire, joue en une
   seconde. */

  box-shadow:0 0 14px 4px rgba(255,255,255,.75)}


/* ---------- la voix de Lisa ---------- */
/* Le bouton reprend la pastille de navigation du module : disque rose,
   halo bleu-gris, pictogramme blanc. L'anneau est un box-shadow et non une
   bordure, pour qu'il deborde sans changer la taille du bouton. */
#hautParleur{position:absolute;right:404px;top:236px;width:58px;height:58px;z-index:9;

   que les pages principales, avec Lisa qui prend beaucoup plus de place ».

   par-dessus la page, et qu'il faut refermer. */

  text-shadow:0 2px 0 rgba(8,58,69,.2)}
#fermer{position:absolute;right:26px;top:24px;width:56px;height:56px;border-radius:50%;
  border:none;background:rgba(255,255,255,.9);color:var(--teal);font-size:27px;
  font-weight:700;cursor:pointer;line-height:1;z-index:9;
  transition:background .2s,transform .2s}
#fermer:hover{background:#fff;transform:scale(1.08)}
#exPan{position:absolute;left:58px;top:316px;z-index:4}
#exBulle{position:absolute;right:420px;bottom:620px;width:410px;z-index:6}
#lisaEx{position:absolute;left:0;right:0;bottom:0;height:838px;z-index:3;
  pointer-events:none;filter:drop-shadow(0 18px 34px rgba(9,58,72,.24))}
#lisaEx .pose{height:838px;opacity:1;transform:none;
  animation:appui 12.7s ease-in-out infinite alternate}
/* La main de Lisa passe DEVANT la bulle. On ne peut pas simplement monter
   Lisa au-dessus : son corps masquerait le texte. On superpose donc une
   copie d'elle, decoupee a la boite de la bulle et posee par-dessus. Seule
   la partie qui mord sur la bulle est redessinee ; le reste vient de la
   couche du dessous, au meme pixel. */
#lisaExDevant{position:absolute;left:0;right:0;bottom:0;height:838px;z-index:7;
  pointer-events:none}
#lisaExDevant .pose{height:838px;opacity:1;transform:none;
  animation:appui 12.7s ease-in-out infinite alternate}

   Une famille cohérente : le moyen de rentrer chez soi. Maison, bus,
   train, avion, planète — la distance ET la fréquence des retours se

/* La duree des etudes, lue comme une jauge : un anneau complet en fond,
   et par-dessus un arc qui s'allonge. Sans l'anneau de fond, impossible de
   dire si l'arc represente un quart ou la moitie — c'est la comparaison
   avec le tour complet qui donne la proportion. Une petite horloge au
   centre rappelle qu'on parle de temps, pas de quantite de travail.  */
function jaugeDuree(part){
  const cx = 32, cy = 32, r = 25;
  const a0 = -Math.PI / 2, a1 = a0 + Math.PI * 2 * part;
  const P = a => [(cx + r * Math.cos(a)).toFixed(2), (cy + r * Math.sin(a)).toFixed(2)];
  const [x0, y0] = P(a0), [x1, y1] = P(a1);
  const grand = part > 0.5 ? 1 : 0;
  const ha = a0 + Math.PI * 2 * part;          // l'aiguille suit la jauge
  return '<svg class="ico" viewBox="0 0 64 64" aria-hidden="true">'
    + `<circle class="piste" cx="${cx}" cy="${cy}" r="${r}"/>`
    + `<path class="jauge" d="M${x0} ${y0}A${r} ${r} 0 ${grand} 1 ${x1} ${y1}"/>`
    + '<circle cx="32" cy="32" r="13.5"/>'
    + '<path d="M32 32V24"/>'
    + `<path d="M32 32l${(7.2*Math.cos(ha)).toFixed(2)} ${(7.2*Math.sin(ha)).toFixed(2)}"/>`
    + '</svg>';
}

function batitPose(hote, cle, hauteur, teteX){
  const a = ANAT[cle];
  const l = Math.round(a.W / a.H * hauteur);
  const d = document.createElement('div');
  d.className = 'pose'; d.dataset.pose = cle;
  d.style.cssText =
    `--img:url(${IMG[cle]});`
    + `--taille:${(a.taille*hauteur).toFixed(1)}px;`
    + `--nuque:${(a.nuque*hauteur).toFixed(1)}px;`
    + `--appui:${(a.appui*100).toFixed(1)}%;`
    + `width:${l}px;height:${hauteur}px;`
    // Lisa ne doit jamais mordre le bord de la scene : maintenant qu'elle
    // est grande, une pose large (la valise) depasserait a droite.
    + `left:${Math.round(Math.min(Math.max(teteX - a.col * l, 4), 1596 - l))}px`;
  d.innerHTML = '<div class="c jambes"></div><div class="c buste"></div>'
              + '<div class="c tete"></div>';
  const y = YEUX[cle];
  if(y){
    const k = hauteur / y.H;
    const pa = document.createElement('div');
    pa.className = 'paup';
    pa.style.cssText = `left:${(y.x*k).toFixed(1)}px;top:${(y.y*k).toFixed(1)}px;`
      + `width:${(y.w*k).toFixed(1)}px;height:${(y.h*k).toFixed(1)}px;`
      + `background-image:url(${CLOS[cle]})`;
    d.querySelector('.tete').appendChild(pa);
  }
  hote.appendChild(d);
  return d;
}

/* ---------- gestes ponctuels ------------------------------------------
   Joués avec composite:'add' : ils s'ajoutent aux boucles CSS au lieu de
   les écraser, donc la respiration continue pendant le hochement.      */
const hasard = (a,b) => a + Math.random()*(b-a);
function couche(sel){
  const p = lisa.querySelector('.pose.vu');
  return p ? p.querySelector(sel) : null;
}
function hoche(force){
  const t = couche('.tete'); if(!t || doux) return;
  t.animate([{transform:'rotate(0deg)'},
             {transform:`rotate(${-1.15*force}deg)`, offset:.3},
             {transform:`rotate(${.42*force}deg)`,  offset:.68},
             {transform:'rotate(0deg)'}],
            {duration:780/force, easing:'ease-in-out', composite:'add'});
}
function epaules(){
  const b = couche('.buste'); if(!b || doux) return;
  b.animate([{transform:'translateY(0)'},
             {transform:'translateY(-2.6px)', offset:.34},
             {transform:'translateY(0)'}],
            {duration:900, easing:'ease-in-out', composite:'add'});
}
function inspire(){
  const b = couche('.buste'); if(!b || doux) return;
  b.animate([{transform:'scale(1,1)'},
             {transform:'scale(1.006,1.013)', offset:.42},
             {transform:'scale(1,1)'}],
            {duration:2600, easing:'ease-in-out', composite:'add'});
}
/* Clignement : fermeture vive, ouverture plus lente. C'est l'asymétrie
   qui le rend naturel ; un fondu symétrique donne un battement de
   machine. Un clignement sur cinq est double, comme en vrai. */
function clignote(duree){
  const p = document.querySelectorAll('.pose.vu .paup');
  if(!p.length || doux) return;
  p.forEach(el => el.animate([
    {opacity:0, offset:0,   easing:'cubic-bezier(.45,0,.85,1)'},
    {opacity:1, offset:.19, easing:'linear'},
    {opacity:1, offset:.55, easing:'cubic-bezier(.1,0,.35,1)'},
    {opacity:0, offset:1}
  ], {duration: duree || (195 + Math.random()*45)}));
}
function boucleClignement(){
  const t = () => {
    clignote();
    if(Math.random() < .22) setTimeout(() => clignote(185), 245);
    setTimeout(t, 1900 + Math.random()*4600);
  };
  setTimeout(t, 900 + Math.random()*2200);
}
function boucle(fn,min,max){
  const t = () => { fn(); setTimeout(t, hasard(min,max)); };
  setTimeout(t, hasard(min/2,max));
}
if(!doux){
  boucle(()=>hoche(hasard(.55,1)), 7000, 16000);
  boucle(epaules, 11000, 24000);
  boucle(inspire,  9000, 19000);
  boucleClignement();
}

/* Le haut-parleur se colle au coin bas-droit de la bulle. Une position
   fixe se decroche des que la cliente rallonge ou raccourcit sa
   consigne : la bulle change de hauteur, le bouton reste en l'air. */
function caleHautParleur(){
  const b = document.getElementById('hautParleur');
  const u = document.getElementById('bulleLisa');
  if(!b || !u) return;
  const d = b.offsetWidth || 58;
  b.style.right = 'auto';
  b.style.left = (u.offsetLeft + u.offsetWidth + 4 - d / 2) + 'px';
  b.style.top  = (u.offsetTop  + u.offsetHeight + 11 - d / 2) + 'px';
}
function dit(el, html, maxh){
  el.innerHTML = html;
  let c = el.id === 'exBulle' ? 19 : 24;
  el.style.fontSize = c+'px';
  let garde = 0;
  while(el.offsetHeight > maxh && c > 13 && garde++ < 40){
    c -= 1; el.style.fontSize = c+'px';
  }
  if(el.id === 'bulleLisa') caleHautParleur();
}

function batitPanneau(hote, k, lecture){
  const G = GRILLE, s = v => v*k;

  const pan = document.createElement('div');

  const x0 = G.padX, x1 = G.W - G.padX, pas = (x1 - x0) / (N - 1);
  const posX = i => x0 + i * pas;

  /* --- la barre --- */
  const rail = document.createElement('div');
  rail.className = 'rail';
  rail.style.cssText = `left:${px(x0 - G.railH)};top:${px(G.railY - G.railH/2)};`
    + `width:${px(x1 - x0 + 2*G.railH)};height:${px(G.railH)}`;
  const remp = document.createElement('div');
  remp.className = 'remp';
  remp.style.width = '0px';
  rail.appendChild(remp);
  pan.appendChild(rail);

  /* --- les crans, un par palier --- */
  const crans = [];
  P.forEach((p, i) => {
    const c = document.createElement('div');
    c.className = 'cran';
    c.style.cssText = `left:${px(posX(i))};top:${px(G.railY)};`
      + `width:${px(G.cran)};height:${px(G.cran)}`;
    pan.appendChild(c); crans.push(c);
  });

  /* --- les tiges et les jalons --- */
  const jalons = [], tiges = [];
  P.forEach((p, i) => {
    const t = document.createElement('div');
    t.className = 'tige';
    t.style.cssText = `left:${px(posX(i) - 2*k)};top:${px(G.tigeTop)};`
      + `width:${px(4)};height:${px(G.tigeBas - G.tigeTop)}`;
    pan.appendChild(t); tiges.push(t);

    const j = document.createElement('div');
    j.className = 'jalon';
    j.style.cssText = `left:${px(posX(i) - G.ico/2)};top:${px(G.icoTop)};`
      + `width:${px(G.ico)};height:${px(G.ico)}`;
    if(!lecture){ j.tabIndex = 0; j.setAttribute('role','button'); }
    j.setAttribute('aria-label', p.bulle);
    j.innerHTML = ICONES[p.icone] + PASTILLE_SURVOL;

    const past = j.querySelector('.pastille');
    past.style.cssText = `width:${px(48)};height:${px(48)};`
      + `right:${px(-14)};bottom:${px(-10)}`;

    const info = document.createElement('div');
    info.className = 'info';
    info.textContent = p.bulle;
    info.style.cssText = `width:${px(G.infoW)};padding:${px(13)} ${px(16)};`
      + `font-size:${px(16)};margin-bottom:${px(G.infoDec)}`;
    j.appendChild(info);

    j.addEventListener('pointerenter', () => bulle.classList.add('recule'));
    j.addEventListener('pointerleave', () => bulle.classList.remove('recule'));
    j.addEventListener('focus',  () => bulle.classList.add('recule'));
    j.addEventListener('blur',   () => bulle.classList.remove('recule'));
    pan.appendChild(j); jalons.push(j);
  });

  /* --- l'étiquette mobile --- */
  const etiq = document.createElement('div');
  etiq.className = 'etiq vierge';
  etiq.style.cssText = `top:${px(G.etiqY)};height:${px(G.etiqH)};`
    + `padding:0 ${px(22)};font-size:${px(19)};line-height:${px(22)}`;
  etiq.innerHTML = '<span class="lab"></span><span class="rep"></span>';
  etiq.querySelector('.rep').style.cssText =
    `font-size:${px(13)};line-height:${px(16)};margin-top:${px(3)}`;
  const etiqLab = etiq.querySelector('.lab'), etiqRep = etiq.querySelector('.rep');
  pan.appendChild(etiq);

  /* --- les bornes --- */
  const bornes = document.createElement('div');
  bornes.className = 'bornes';
  bornes.style.cssText = `top:${px(G.borneY)};padding:0 ${px(G.padX - G.railH - 4)};`
    + `font-size:${px(16)}`;
  bornes.innerHTML = '<span></span><span></span>';
  bornes.children[0].textContent = CFG.textes.bornGauche;
  bornes.children[1].textContent = CFG.textes.bornDroite;
  pan.appendChild(bornes);

  /* --- la poignée et sa zone de saisie --- */
  const zone = document.createElement('div');
  zone.className = 'zone';
  zone.style.cssText = `left:${px(x0 - G.railH - 20)};top:${px(G.railY - 34)};`
    + `width:${px(x1 - x0 + 2*G.railH + 40)};height:${px(68)}`;
  const poig = document.createElement('div');
  poig.className = 'poig';
  poig.style.cssText = `top:${px(34 - G.poigH/2)};width:${px(G.poigW)};`
    + `height:${px(G.poigH)};left:0`;
  poig.innerHTML = `<i style="width:${px(3)};height:${px(15)}"></i>`
                 + `<i style="width:${px(3)};height:${px(15)}"></i>`;
  poig.style.gridAutoFlow = 'column';
  if(!lecture){
    poig.tabIndex = 0;
    poig.setAttribute('role','slider');
    poig.setAttribute('aria-valuemin','1');
    poig.setAttribute('aria-valuemax', String(N));
    poig.setAttribute('aria-label', CFG.question);
  }
  zone.appendChild(poig);
  pan.appendChild(zone);

  hote.appendChild(pan);

  /* ------------------------------------------------------------------
     État et rendu. `t` est la position continue en unités de palier
     (0 → N-1) : pendant le glissement elle est libre, au relâchement
     elle s'aimante sur l'entier le plus proche.
     ------------------------------------------------------------------ */
  let t = 0, idx = 0, touche = false, repondu = false, anim = null;
  // `t` : position continue pendant le glissement. `idx` : le palier retenu.
  const zoneG = { x0: s(x0 - G.railH - 20), largeur: s(x1 - x0 + 2*G.railH + 40) };

  /* composite:'add' — le petit saut s'ajoute au scale pilote par --proche
     au lieu de l'ecraser. Sans ca, l'icone retomberait a l'echelle 1 le
     temps de l'animation. */
  function rebond(i, force){
    if(doux || !jalons[i]) return;
    const ico = jalons[i].querySelector('.ico');
    if(!ico) return;
    ico.animate([{transform:'translateY(0)'},
                 {transform:`translateY(${-7 * force}px)`, offset:.38},
                 {transform:'translateY(0)'}],
                {duration: 420 / Math.max(.6, force),
                 easing:'cubic-bezier(.3,1.4,.5,1)', composite:'add'});
  }

  function rend(){
    const xr = s(posX(0) + t * pas);               // abscisse dans le panneau
    poig.style.left = (xr - zoneG.x0 - s(G.poigW)/2).toFixed(1) + 'px';
    remp.style.width = (xr - s(x0 - G.railH)).toFixed(1) + 'px';
    remp.style.setProperty('--plein', s(x1 - x0 + 2*G.railH) + 'px');
    const proche = Math.round(t);
    crans.forEach((c,i) => c.classList.toggle('passe', i <= proche));
    jalons.forEach((j,i) => {
      // 1 quand le curseur est pile dessous, 0 des qu'il est a un cran
      const a = touche ? Math.max(0, 1 - Math.abs(i - t)) : 0;
      j.style.setProperty('--proche', a.toFixed(3));
      tiges[i].style.setProperty('--proche', a.toFixed(3));
      j.classList.toggle('actif', i === proche && touche);
      tiges[i].classList.toggle('actif', i === proche && touche);
    });
    // l'étiquette reste dans le panneau, même aux extrémités
    const demi = etiq.offsetWidth / 2 || 0;
    etiq.style.left = Math.max(demi + s(14),
                       Math.min(s(G.W) - demi - s(14), xr)).toFixed(1) + 'px';
  }

  /* i : le palier a afficher. Pendant le glissement c'est l'apercu sous le
     doigt ; ailleurs c'est le palier retenu — surtout pas Math.round(t),
     qui est encore en train de rejoindre sa cible pendant l'aimantation. */
  function texteEtiq(i){
    if(!touche){
      etiq.classList.add('vierge');
      etiqLab.textContent = CFG.textes.invite;
      etiqRep.textContent = '';
    } else {
      etiq.classList.remove('vierge');
      const p = P[Math.max(0, Math.min(N-1, i === undefined ? idx : i))];
      etiqLab.textContent = p.court;
      etiqRep.textContent = p.repere || '';
    }
    rend();
  }

  function pose(i, avecSaut){
    const nouveau = Math.max(0, Math.min(N-1, i));
    const change  = !repondu || nouveau !== idx;
    idx = nouveau; touche = true; repondu = true;
    pan.classList.remove('vierge');
    poig.setAttribute('aria-valuenow', String(idx+1));
    poig.setAttribute('aria-valuetext', P[idx].bulle);
    glisse(idx);
    texteEtiq();
    if(change && avecSaut !== false) rebond(idx, 1);
    if(change && typeof onChange === 'function') onChange(idx);
  }

  /* petite animation d'aimantation : ressort court, pas un fondu plat */
  function glisse(cible){
    if(anim) cancelAnimationFrame(anim);
    if(doux){ t = cible; rend(); return; }
    const depart = t, delta = cible - depart, t0 = performance.now(), duree = 320;
    const pas2 = now => {
      const u = Math.min(1, (now - t0) / duree);
      const e = 1 - Math.pow(1 - u, 3);
      t = depart + delta * e;
      rend();
      if(u < 1) anim = requestAnimationFrame(pas2); else anim = null;
    };
    anim = requestAnimationFrame(pas2);
  }

  let onChange = null;

  if(!lecture){
    /* --- glisser --- */
    const versT = ev => {
      const r = zone.getBoundingClientRect();
      const u = (ev.clientX - r.left - (s(G.railH) + s(20))) / (r.width - 2*(s(G.railH)+s(20)));
      return Math.max(0, Math.min(N-1, u * (N-1)));
    };
    let prise = false, dernierX = 0;
    const bouge = ev => {
      if(!prise) return;
      if(anim){ cancelAnimationFrame(anim); anim = null; }
      const avant = Math.round(t);
      // inclinaison proportionnelle a la vitesse, bornee a 7 degres
      const dx = ev.clientX - dernierX; dernierX = ev.clientX;
      poig.style.setProperty('--incl',
        Math.max(-7, Math.min(7, dx * 0.55)).toFixed(2) + 'deg');
      t = versT(ev); rend();
      const apres = Math.round(t);
      if(apres !== avant){ texteEtiq(apres); rebond(apres, .7); }
    };
    zone.addEventListener('pointerdown', ev => {
      prise = true; touche = true; pan.classList.remove('vierge');
      zone.classList.add('prise'); dernierX = ev.clientX;
      zone.setPointerCapture(ev.pointerId);
      poig.focus({preventScroll:true});
      bouge(ev);
      ev.preventDefault();
    });
    zone.addEventListener('pointermove', bouge);
    const lache = ev => {
      if(!prise) return;
      prise = false; zone.classList.remove('prise');
      poig.style.setProperty('--incl', '0deg');
      try{ zone.releasePointerCapture(ev.pointerId); }catch(e){}
      pose(Math.round(t));
    };
    zone.addEventListener('pointerup', lache);
    zone.addEventListener('pointercancel', lache);

    /* --- clavier --- */
    poig.addEventListener('keydown', ev => {
      const k2 = ev.key;
      let n = idx;
      if(k2==='ArrowRight'||k2==='ArrowUp')      n = idx+1;
      else if(k2==='ArrowLeft'||k2==='ArrowDown')n = idx-1;
      else if(k2==='Home')                       n = 0;
      else if(k2==='End')                        n = N-1;
      else if(k2===' '||k2==='Enter')            n = idx;
      else return;
      ev.preventDefault();
      pose(n);
    });

    /* --- cliquer une icône --- */
    jalons.forEach((j,i) => {
      j.addEventListener('click', () => pose(i));
      j.addEventListener('keydown', ev => {
        if(ev.key==='Enter'||ev.key===' '){ ev.preventDefault(); pose(i); }
      });
    });
  }

  texteEtiq();
  requestAnimationFrame(rend);

  /* Abscisse de la poignee dans le repere de la scene : sert a faire
     partir les confettis du curseur plutot que du haut de l'ecran. */
  function centreX(){
    const r = poig.getBoundingClientRect(), st = $('#stage').getBoundingClientRect();
    const k2 = st.width / 1600;
    return (r.left + r.width / 2 - st.left) / (k2 || 1);
  }

  /* Le trajet, joue une fois : un point part de la maison et rejoint le
     palier choisi en suivant la barre. */
  function voyage(){
    if(doux) return;
    const d = document.createElement('div');
    d.className = 'voyage';
    const taille = s(G.railH) - 4;
    d.style.cssText = `width:${taille}px;height:${taille}px;`
      + `top:${s(G.railY) - taille / 2}px;left:${s(posX(0)) - taille / 2}px`;
    pan.appendChild(d);
    const a = d.animate(
      [{transform:'translateX(0)', opacity:0},
       {opacity:1, offset:.12},
       {opacity:1, offset:.8},
       {transform:`translateX(${s(idx * pas)}px)`, opacity:0}],
      {duration: 340 + idx * 190, easing:'cubic-bezier(.35,.1,.25,1)'});
    a.onfinish = () => d.remove();
  }

  return {
    element: pan,
    centreX, voyage,
    get index(){ return repondu ? idx : -1; },
    set(i){ pose(i, false); },
    poseMuette(i){ idx = i; touche = true; repondu = true; pan.classList.remove('vierge');
                   t = i; texteEtiq(); rend();
                   jalons.forEach((j,n2) => j.classList.toggle('actif', n2===i));
                   tiges .forEach((g,n2) => g.classList.toggle('actif', n2===i)); },
    remise(){ touche = false; repondu = false; idx = 0; pan.classList.add('vierge');
              jalons.forEach(j => j.classList.remove('actif'));
              tiges.forEach(g => g.classList.remove('actif'));
              poig.removeAttribute('aria-valuenow');
              glisse(0); texteEtiq(); },
    surChangement(f){ onChange = f; },
    focus(){ poig.focus({preventScroll:true}); }
  };
}

/* ---------- confettis -------------------------------------------------
   Des rectangles, pas des images : rien à charger, et la couleur suit la
   charte. Chacun part d'une abscisse au hasard, dérive, tourne sur
   lui-même et disparaît. Ils se retirent du document en fin de course. */
function confettis(n, depuis){
  if(doux || (CFG.options && CFG.options.confettis === false)) return;
  const st = $('#stage');
  const c  = CFG.couleurs;
  const teintes = [c.rose, c.teal, '#f6c544', c.violet, '#ffffff', '#43c04a'];
  for(let i = 0; i < n; i++){
    const d = document.createElement('div');
    d.className = 'conf';
    // depuis le curseur quand on le connait : la recompense part de la ou
    // l'eleve a agi, pas d'un bord de l'ecran qui n'a rien fait.
    d.style.left = depuis == null
      ? (50 + Math.random()*1500) + 'px'
      : Math.max(10, Math.min(1580, depuis + (Math.random()-.5) * 340)) + 'px';
    d.style.width      = (7 + Math.random()*8) + 'px';
    d.style.height     = (10 + Math.random()*13) + 'px';
    d.style.background = teintes[i % teintes.length];
    st.appendChild(d);
    const derive = (Math.random() - .5) * 300;
    const tour   = 360 * (2 + Math.random()*4);
    const a = d.animate([
      {transform:`translate(0,${depuis == null ? 0 : 560}px) rotate(0deg)`, opacity:1},
      {transform:`translate(${derive*.35}px,${(depuis == null ? 0 : 560) - 150}px) `
        + `rotate(${tour*.45}deg)`, opacity:1, offset:.45},
      {transform:`translate(${derive}px,${(depuis == null ? 0 : 560) + 620}px) `
        + `rotate(${tour}deg)`, opacity:0}
    ], {duration: 2300 + Math.random()*1700, delay: Math.random()*500,
        easing:'cubic-bezier(.25,.6,.5,1)'});
    a.onfinish = () => d.remove();
  }
}

/* --- la main devant la bulle -------------------------------------------
   La copie est creee dans le meme tick que l'originale : leurs animations
   demarrent a la meme image, donc les deux dessins restent superposes au
   pixel pres. On les resynchronise quand meme, par precaution. */
function mainDevant(){
  const src = $('#lisaEx'), bulle = $('#exBulle'), carte = $('#carte');
  if(!src || !bulle || !carte) return;
  const copie = src.cloneNode(true);
  copie.id = 'lisaExDevant';
  copie.querySelectorAll('.paup').forEach(e => e.remove());
  carte.appendChild(copie);
  const a1 = src.getAnimations({subtree:true});
  const a2 = copie.getAnimations({subtree:true});
  a2.forEach((a,i) => { if(a1[i] && a1[i].startTime !== null) a.startTime = a1[i].startTime; });
  function decoupe(){
    // inset() se mesure sur la boite de l'element decoupe, PAS sur la carte.
    // La copie de la question 2 ne fait que 340 px de large : calculer dans
    // le repere de la carte decoupait 800 px a cote.
    const rc = carte.getBoundingClientRect();
    const re = copie.getBoundingClientRect(), rb = bulle.getBoundingClientRect();
    if(!rb.width || !re.width) return;
    const k = rc.width / carte.offsetWidth || 1;
    const x = (rb.left - re.left) / k, y = (rb.top - re.top) / k;
    const w = rb.width / k, h = rb.height / k;
    copie.style.clipPath = 'inset(' + y.toFixed(1) + 'px '
      + (copie.offsetWidth - x - w).toFixed(1) + 'px '
      + (copie.offsetHeight - y - h).toFixed(1) + 'px ' + x.toFixed(1) + 'px)';
  }
  decoupe();
  addEventListener('resize', decoupe);
  requestAnimationFrame(decoupe);
}
mainDevant();

/* ---------- la voix de Lisa -------------------------------------------
   Trois repliques courtes et fixes. Elles ne repetent JAMAIS la consigne :
   la cliente retouche ses textes depuis son panneau, et une voix qui
   decrit l'ecran finirait par dire autre chose que la bulle.

   Aucun navigateur ne laisse un son demarrer avant un clic DANS le cadre.
   Arriver par la fleche de Genially ne compte pas : c'est un clic sur la
   page du dessus. D'ou la regle : l'accueil ATTEND le premier geste, les
   deux autres partent seules puisqu'a ce moment l'eleve a deja clique.

   Chaque replique est doublee d'un sous-titre : un eleve sans son voit ce

const boutonVoix = document.getElementById('hautParleur');
const stitre = document.getElementById('soustitre');
let lecteursVoix = {}, clipEnCours = 'accueil', voixDejaJouee = false, minuterie = null;

const aDuSonVoix = c => CLIPS[c] && CLIPS[c].src.indexOf('data:audio') === 0;

function lecteurVoix(cle){
  if(lecteursVoix[cle]) return lecteursVoix[cle];
  if(!aDuSonVoix(cle)) return null;
  const a = document.createElement('audio');
  a.preload = 'auto'; a.src = CLIPS[cle].src; a.style.display = 'none';
  document.body.appendChild(a);
  a.addEventListener('play',  () => { boutonVoix.classList.add('parle');
    boutonVoix.classList.remove('muet'); stitre.classList.remove('bloque');
    boutonVoix.title = T_VOIX.titre; });
  a.addEventListener('pause', () => boutonVoix.classList.remove('parle'));
  a.addEventListener('ended', () => { boutonVoix.classList.remove('parle'); cacheSousTitre(1800); });
  a.addEventListener('error', () => plainteVoix('lecture impossible'));
  lecteursVoix[cle] = a;
  return a;
}
function montreSousTitreVoix(cle){
  const t = CLIPS[cle] && CLIPS[cle].texte;
  if(!t) return;
  clearTimeout(minuterie);
  stitre.querySelector('.dit').textContent = t;
  stitre.classList.add('vu');
}
function cacheSousTitre(ms){
  clearTimeout(minuterie);
  minuterie = setTimeout(() => stitre.classList.remove('vu'), ms);
}
/* Un echec muet est le pire des cas : personne ne sait s'il faut monter le
   volume ou signaler un bogue. On l'affiche, et le sous-titre reste. */
function plainteVoix(quoi){
  boutonVoix.classList.remove('parle');
  boutonVoix.classList.add('muet');
  boutonVoix.title = T_VOIX.echec + ' (' + quoi + ')';
  stitre.querySelector('.alerte').textContent = T_VOIX.bloquee;
  stitre.classList.add('bloque');
  montreSousTitreVoix(clipEnCours);
  cacheSousTitre(14000);          // le temps de lire les deux
}
function joueVoix(cle){
  const a = lecteurVoix(cle);
  if(!a) return;
  Object.keys(lecteursVoix).forEach(k => { if(k !== cle) lecteursVoix[k].pause(); });
  clipEnCours = cle;
  /* pas de sous-titre a la lecture : il masquait Lisa et le
     bouton Exemple. Il ne reste que pour un son bloque. */
  try { if(a.readyState > 0) a.currentTime = 0; } catch(e){}
  let p;
  try { p = a.play(); } catch(e){ plainteVoix(e.name); return; }
  if(p && p.catch) p.catch(e => plainteVoix(e.name));
}
boutonVoix.onclick = () => {
  const a = lecteurVoix(clipEnCours);
  if(!a) return;
  voixDejaJouee = true;
  if(!a.paused){ a.pause(); cacheSousTitre(400); return; }   // deuxieme clic : on coupe
  joueVoix(clipEnCours);
};
function premierGesteVoix(){
  if(voixDejaJouee) return;
  voixDejaJouee = true;
  joueVoix('accueil');
}
if(!aDuSonVoix('accueil') && !aDuSonVoix('exemple') && !aDuSonVoix('fin'))
  boutonVoix.style.display = 'none';

/* Le premier geste dans le cadre : c'est lui qui debloque le son pour le
   navigateur. Arriver par la fleche de Genially ne compte pas. */
const _scene = document.getElementById('stage');
if(_scene) _scene.addEventListener('pointerdown', ev => {
  /* Un clic SUR le haut-parleur ne compte pas comme premier geste :
     sinon la voix demarre ici, et le onclick du bouton, qui suit,
     la remet en pause. Il fallait cliquer deux fois. */
  if(boutonVoix && boutonVoix.contains(ev.target)) return;
  premierGesteVoix();
}, true);   // capture : le curseur arrete la propagation

/* ---------- mise à l'échelle ---------- */
function ajuste(){
  const k = Math.min(innerWidth/1600, innerHeight/900);
  const st = $('#stage'), cd = $('#cadre');
  st.style.transform = `scale(${k})`;
  cd.style.width  = (1600*k)+'px';
  cd.style.height = (900*k)+'px';
}
addEventListener('resize', ajuste);

/* ---------- départ ---------- */
ajuste();
montre('consigne');
dit(bulle, T.consigne, MAXH);
</script>
