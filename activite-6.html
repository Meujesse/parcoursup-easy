<body>
<script>
/* Porte d'entrée de l'activité.

   GitHub Pages demande aux navigateurs de garder les pages en mémoire
   pendant dix minutes. Après « Enregistrer les modifications », l'ancienne
   version continuait donc de s'afficher dans Genially.

   Cette page-ci ne change jamais : la garder en mémoire est sans
   conséquence. Elle renvoie aussitôt vers l'activité, avec un repère de
   temps qui change chaque minute — le navigateur est obligé d'aller
   rechercher la dernière version. Une modification est visible au bout
   d'une minute.

   C'est une redirection, pas un cadre dans un cadre : Genially n'affiche
   qu'un seul iframe, et l'activité reste pleinement cliquable.            */
location.replace('question-6-duree.html?v=' + Math.floor(Date.now() / 60000)
                 + location.hash);
</script>
<noscript>
  <p style="font-family:system-ui;padding:2rem">
    <a href="question-6-duree.html">Ouvrir l'activité</a>
  </p>
</noscript>
</body>
