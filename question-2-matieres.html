/* ============================================================
   Les matières, les textes et l'exemple de Lisa sont dans le
   bloc <script id="config"> en bas de page.
   ============================================================ */
:root{
  --teal:#127992; --teal-clair:#6fb3c3; --rose:#ea1f5c; --violet:#7c7baa;
  --blanc:#ffffff;
  --fond:var(--teal-clair);
  --bulle-fond:#f8f8f8;
  --sur-fond:#083a45;
  --ligne:#eef4fa;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--fond);
  font-family:"Montserrat",system-ui,-apple-system,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased}

#fit{position:fixed;inset:0;display:grid;place-items:center;overflow:hidden}
#cadre{position:relative}
#stage{width:1600px;height:900px;position:absolute;top:0;left:0;
  transform-origin:top left;background:var(--fond);overflow:hidden}

/* ---------- titre ---------- */
.titre{position:absolute;left:70px;top:52px;color:var(--blanc);z-index:5}
.titre h1{font-size:68px;font-weight:800;line-height:.95;letter-spacing:-1px;
  text-shadow:0 3px 0 rgba(8,58,69,.32)}
.titre p{font-size:29px;font-weight:600;margin-top:14px;max-width:730px;line-height:1.22;
  text-shadow:0 2px 0 rgba(8,58,69,.22)}

/* ---------- tableau ---------- */
#tab{position:absolute;left:70px;top:240px;width:900px;z-index:4;
  border-collapse:separate;border-spacing:0;
  border:3px solid var(--sur-fond);border-radius:4px;overflow:hidden;
  box-shadow:0 14px 34px rgba(9,58,72,.22)}
#tab th{background:var(--teal);color:var(--blanc);font-size:21px;font-weight:700;
  padding:17px 10px;border-right:3px solid var(--sur-fond);
  border-bottom:3px solid var(--sur-fond)}
#tab th:last-child{border-right:none}
#tab td{background:var(--ligne);border-right:3px solid var(--sur-fond);
  border-bottom:3px solid var(--sur-fond);height:74px;padding:0 10px;text-align:center;
  transition:background .3s ease}
#tab tr:last-child td{border-bottom:none}
#tab td:last-child{border-right:none}
#tab td.nom{font-size:21px;font-weight:700;color:var(--sur-fond);position:relative}
#tab td.nom .etiq{display:block;margin:5px auto 0;width:max-content;
  font-size:11px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;
  padding:3px 10px;border-radius:999px;color:#fff;opacity:0;
  transform:translateY(-4px) scale(.8);
  transition:opacity .3s ease,transform .42s cubic-bezier(.34,1.7,.5,1)}
#tab td.nom .etiq.vu{opacity:1;transform:none}
#tab td.nom .etiq.f{background:var(--teal)}
#tab td.nom .etiq.l{background:var(--rose)}
#tab td.cell-aime,#tab td.cell-moy{background:var(--blanc)}
#tab col.c1{width:302px} #tab col.c2{width:330px} #tab col.c3{width:262px}

/* survol : sur un tableau large, on doit voir la ligne qu'on vise */
#corps tr:not(.fort):not(.levier):not(.manque):hover td{background:#e4eef6}
#corps tr:not(.fort):not(.levier):not(.manque):hover td.cell-aime,
#corps tr:not(.fort):not(.levier):not(.manque):hover td.cell-moy{background:#fbfdff}

/* liseré de bilan sur le bord gauche de la ligne */
#tab tr.manque td.nom{box-shadow:inset 9px 0 0 #f0940e}
#tab tr.manque td{background:#fff3e0}
#tab tr.manque td.cell-aime{background:var(--blanc)}
#tab tr.manque td.cell-moy{background:#fff8ee}
@keyframes sursaut{0%,100%{transform:translateX(0)}
  22%{transform:translateX(-5px)}62%{transform:translateX(4px)}}
#tab tr.manque.secoue td{animation:sursaut .42s ease-in-out}
#tab tr.fort   td.nom{box-shadow:inset 9px 0 0 var(--teal)}
#tab tr.levier td.nom{box-shadow:inset 9px 0 0 var(--rose)}
#tab tr.fort   td{background:#e2f0f4}
#tab tr.levier td{background:#fdedf2}
#tab tr.fort td.cell-aime,#tab tr.fort td.cell-moy,
#tab tr.levier td.cell-aime,#tab tr.levier td.cell-moy{background:var(--blanc)}

/* case à cocher */
.case{width:46px;height:46px;border:3px solid #4a5560;border-radius:5px;
  background:var(--blanc);cursor:pointer;display:inline-block;position:relative;
  transition:transform .2s cubic-bezier(.34,1.5,.5,1),border-color .2s,box-shadow .2s}
.case:hover{transform:scale(1.09);border-color:var(--teal);
  box-shadow:0 4px 14px rgba(9,58,72,.2)}
.case svg{position:absolute;left:-7px;top:-16px;width:62px;height:62px;
  opacity:0;transform:scale(.5) rotate(-14deg);transform-origin:40% 70%;
  transition:opacity .18s ease,transform .34s cubic-bezier(.34,1.7,.5,1)}
.case.coche svg{opacity:1;transform:none}

/* smileys */
.moy{display:flex;justify-content:center;align-items:center;gap:14px}
.sm{width:54px;height:54px;cursor:pointer;border:none;background:none;padding:0;
  border-radius:50%;filter:grayscale(.8);opacity:.48;
  transition:transform .22s cubic-bezier(.34,1.5,.5,1),opacity .22s,filter .22s,box-shadow .22s}
.sm svg{display:block;width:100%;height:100%;pointer-events:none}
.sm:hover{filter:none;opacity:1;transform:scale(1.22) rotate(-4deg)}
.sm svg *{transform-box:fill-box;transform-origin:center}
.sm.pris{filter:none;opacity:1;transform:scale(1.07);
  box-shadow:0 0 0 4px var(--rose),0 6px 16px rgba(234,31,92,.4)}
.moy.repondu .sm:not(.pris){opacity:.2}
.moy.repondu .sm:not(.pris):hover{opacity:.85}

/* ligne libre */
.libre input{width:100%;border:none;background:transparent;font:inherit;font-size:20px;
  font-weight:700;color:var(--sur-fond);text-align:center;outline:none;
  border-bottom:2.5px dashed #9bb3bd;padding:5px 2px;transition:border-color .25s}
.libre input::placeholder{font-weight:600;color:#7d94a0;font-size:17px}
.libre input:focus{border-bottom-color:var(--teal)}

/* ---------- légende et bouton rejouer ---------- */
#legende{position:absolute;left:70px;top:752px;z-index:5;display:flex;align-items:center;
  gap:16px;font-size:18px;font-weight:600;color:var(--sur-fond)}
#legende .item{display:flex;align-items:center;gap:7px}
#legende svg{width:34px;height:34px;display:block}
#legende .tt{font-weight:800;letter-spacing:.3px;margin-right:2px}

#actions{position:absolute;left:70px;width:900px;top:800px;z-index:8;
  display:flex;justify-content:flex-end;align-items:center;gap:16px}
/* Tant qu'il reste des lignes vides, le bouton reste discret. Des que
   tout est pose, il s'allume et respire : le signal « c'est pret » sans
   compteur ni barre de progression. */
#btnValider.range{opacity:0;pointer-events:none;transition:opacity .3s ease}
#btnCarte{font-size:19px;padding:12px 24px;opacity:0;pointer-events:none;
  transition:opacity .5s ease .2s}
#btnCarte.vu{opacity:1;pointer-events:auto}
#motCarte{position:absolute;left:70px;width:900px;top:858px;text-align:right;z-index:8;
  font-size:16px;font-weight:600;color:var(--sur-fond);opacity:0;
  transition:opacity .35s ease;pointer-events:none}
#motCarte.vu{opacity:1;pointer-events:auto}

/* ---------- Lisa vivante, plein pied -------------------------------
   Trois couches sur la même image (une seule fois en base64, partagée
   par variable CSS). Les masques sont complémentaires : là où l'une
   s'efface, l'autre apparaît, donc jamais de double rendu.
     jambes  fixes        buste  respire        tete  dérive
   L'ensemble reporte lentement son poids autour du point d'appui. */
#lisa{position:absolute;right:24px;bottom:0;width:340px;height:862px;z-index:3;
  filter:drop-shadow(0 18px 34px rgba(9,58,72,.24))}
.pose{position:absolute;right:0;bottom:0;height:862px;opacity:0;
  transform:scale(.985);
  transition:opacity .45s ease,transform .55s cubic-bezier(.34,1.3,.5,1);
  transform-origin:var(--appui) 100%}
.pose.vu{opacity:1;transform:none;animation:appui 11.3s ease-in-out infinite alternate}
.c{position:absolute;inset:0;background:var(--img) no-repeat center/100% 100%}

.jambes{-webkit-mask-image:linear-gradient(to top,#000 calc(var(--taille) - 34px),
                                           transparent calc(var(--taille) + 34px));
        mask-image:linear-gradient(to top,#000 calc(var(--taille) - 34px),
                                   transparent calc(var(--taille) + 34px))}
.buste{-webkit-mask-image:linear-gradient(to top,
   transparent calc(var(--taille) - 34px), #000 calc(var(--taille) + 34px),
   #000 calc(var(--nuque) - 26px), transparent calc(var(--nuque) + 26px));
       mask-image:linear-gradient(to top,
   transparent calc(var(--taille) - 34px), #000 calc(var(--taille) + 34px),
   #000 calc(var(--nuque) - 26px), transparent calc(var(--nuque) + 26px));
  transform-origin:50% calc(100% - var(--taille));
  animation:souffle 4.6s ease-in-out infinite}
.paup{position:absolute;opacity:0;pointer-events:none;
  background-repeat:no-repeat;background-size:100% 100%}
.tete{-webkit-mask-image:linear-gradient(to top,
   transparent calc(var(--nuque) - 26px), #000 calc(var(--nuque) + 26px));
      mask-image:linear-gradient(to top,
   transparent calc(var(--nuque) - 26px), #000 calc(var(--nuque) + 26px));
  transform-origin:50% calc(100% - var(--nuque));
  animation:derive 7.3s ease-in-out infinite alternate}

@keyframes appui{from{transform:rotate(-.17deg)} to{transform:rotate(.19deg)}}
@keyframes souffle{0%{transform:scale(1,1)}38%{transform:scale(1.0035,1.007)}

@keyframes derive{from{transform:rotate(-.45deg) translateY(.6px)}
                  to  {transform:rotate(.5deg) translateY(-.5px)}}
@media (prefers-reduced-motion: reduce){
  .pose.vu,.buste,.tete{animation:none}
}
body.figee .pose.vu,body.figee .buste,body.figee .tete{animation:none}

.bulle{position:absolute;background:var(--bulle-fond);border:2.5px solid var(--teal);

/* queue sur le flanc droit : Lisa est debout à côté, pas en dessous */
.bulle.droite::before{right:-26px;bottom:30px;border-width:14px 0 14px 26px;
  border-color:transparent transparent transparent var(--teal)}
.bulle.droite::after{right:-21px;bottom:34px;border-width:11px 0 11px 21px;

/* ---------- la pastille « Cliquer pour en savoir plus » ----------------
   Reprise trait pour trait de la legende des boutons du Genially (page 6) :
   halo gris pale qui bat, disque rose, main blanche qui appuie. Le caractere fleche qui
   servait avant n'existe nulle part dans cette legende. */
.pastille{display:block;overflow:visible}
.pastille .halo{fill:#e0e2eb;opacity:.8;transform-box:fill-box;
  transform-origin:center;animation:battement 2.4s ease-in-out infinite}

.pastille .main{fill:#fff}
@keyframes battement{0%,100%{transform:scale(.8);opacity:.85}
                     55%    {transform:scale(1);opacity:.22}}

/* Haut-parleur, sous la bulle et a droite du tableau. La bulle est ancree

   place quelle que soit la longueur du texte. Le tableau s'arrete a 970 px,

#hautParleur{position:absolute;left:1006px;top:270px;width:46px;height:46px;z-index:7;

/* ---------- état ---------- */
let etat = [];                       // une entrée par ligne : {aime, n, nom}
let doux = matchMedia('(prefers-reduced-motion: reduce)').matches;

const $ = s => document.querySelector(s);
const corps  = $('#corps');
const bulle  = $('#bulleLisa');
const lisa   = $('#lisa');

/* ---------- Lisa : construction des trois couches ---------- */
function batitPose(hote, cle, hauteur){
  const a = ANAT[CLE_ANAT[cle]];
  const d = document.createElement('div');
  d.className = 'pose'; d.dataset.pose = cle;
  d.style.cssText =
    `--img:url(${IMG[cle]});`
    + `--taille:${(a.taille*hauteur).toFixed(1)}px;`
    + `--nuque:${(a.nuque*hauteur).toFixed(1)}px;`
    + `--appui:${(a.appui*100).toFixed(1)}%;`
    + `width:${Math.round(a.W/a.H*hauteur)}px;height:${hauteur}px`;
  d.innerHTML = '<div class="c jambes"></div><div class="c buste"></div>'
              + '<div class="c tete"></div>';
  // La paupiere fermee vit dans la couche « tete » : elle suit donc les
  // derives et les hochements sans qu'on ait a la deplacer.
  const y = YEUX[CLE_ANAT[cle]];
  if(y){
    const k = hauteur / y.H;
    const pa = document.createElement('div');
    pa.className = 'paup';
    pa.style.cssText = `left:${(y.x*k).toFixed(1)}px;top:${(y.y*k).toFixed(1)}px;`
      + `width:${(y.w*k).toFixed(1)}px;height:${(y.h*k).toFixed(1)}px;`
      + `background-image:url(${CLOS[cle]})`;
    d.querySelector('.tete').appendChild(pa);
  }
  hote.appendChild(d);
  return d;
}
// 862 : meme presence que sur les pages composees dans Genially
['consigne','bilan','reprise'].forEach(c => batitPose(lisa, c, 862));
batitPose(lisaEx, 'exemple', 430).classList.add('vu');

function montre(cle){
  lisa.querySelectorAll('.pose').forEach(p =>
    p.classList.toggle('vu', p.dataset.pose === cle));
}

/* ---------- gestes ponctuels ------------------------------------------
   Joués avec composite:'add' : ils s'ajoutent aux boucles CSS au lieu de
   les écraser, donc la respiration continue pendant le hochement.      */
const hasard = (a,b) => a + Math.random()*(b-a);
function couche(sel){
  const p = lisa.querySelector('.pose.vu');
  return p ? p.querySelector(sel) : null;
}
function hoche(force){
  const t = couche('.tete'); if(!t || doux) return;
  t.animate([{transform:'rotate(0deg)'},
             {transform:`rotate(${-1.15*force}deg)`, offset:.3},
             {transform:`rotate(${.42*force}deg)`,  offset:.68},
             {transform:'rotate(0deg)'}],
            {duration:780/force, easing:'ease-in-out', composite:'add'});
}
function epaules(){
  const b = couche('.buste'); if(!b || doux) return;
  b.animate([{transform:'translateY(0)'},
             {transform:'translateY(-2.6px)', offset:.34},
             {transform:'translateY(0)'}],
            {duration:900, easing:'ease-in-out', composite:'add'});
}
function inspire(){
  const b = couche('.buste'); if(!b || doux) return;
  b.animate([{transform:'scale(1,1)'},
             {transform:'scale(1.006,1.013)', offset:.42},
             {transform:'scale(1,1)'}],
            {duration:2600, easing:'ease-in-out', composite:'add'});
}
/* Clignement : fondu en deux temps, fermeture vive, ouverture plus lente.
   C'est l'asymetrie qui le rend naturel ; un fondu symetrique donne un
   battement de machine. Duree et intervalle tires au sort, et un
   clignement sur cinq est double, comme en vrai. */
function clignote(duree){
  const p = document.querySelectorAll('.pose.vu .paup');
  if(!p.length || doux) return;
  p.forEach(el => el.animate([
    {opacity:0, offset:0,   easing:'cubic-bezier(.45,0,.85,1)'},
    {opacity:1, offset:.19, easing:'linear'},
    {opacity:1, offset:.55, easing:'cubic-bezier(.1,0,.35,1)'},
    {opacity:0, offset:1}
  ], {duration: duree || (195 + Math.random()*45)}));
}
function boucleClignement(){
  const t = () => {
    clignote();
    if(Math.random() < .22) setTimeout(() => clignote(185), 245);
    setTimeout(t, 1900 + Math.random()*4600);
  };
  setTimeout(t, 900 + Math.random()*2200);
}

function boucle(fn,min,max){
  const t = () => { fn(); setTimeout(t, hasard(min,max)); };
  setTimeout(t, hasard(min/2,max));
}
if(!doux){
  boucle(()=>hoche(hasard(.55,1)), 7000, 16000);
  boucle(epaules, 11000, 24000);
  boucle(inspire,  9000, 19000);
  boucleClignement();
}
function reagit(){ hoche(1.2); epaules(); }

/* ---------- le visage choisi joue son expression ----------------------
   Chaque niveau a son geste : le sourire s'ouvre d'un coup, le neutre
   hesite de gauche a droite, le triste laisse couler ses larmes. C'est
   court, c'est lisible, et ca recompense le clic sans rien ralentir. */
function expression(bouton, cle){
  if(doux) return;
  const q = s => bouton.querySelectorAll(s);
  const jouer = (sel, images, options) =>
    q(sel).forEach(e => e.animate(images, options));

  jouer('.f', [{transform:'scale(1)'},{transform:'scale(1.24)',offset:.34},
               {transform:'scale(.97)',offset:.66},{transform:'scale(1)'}],
        {duration:520, easing:'cubic-bezier(.34,1.6,.5,1)'});

  if(cle === 'bien'){
    jouer('.b',  [{transform:'scaleY(1)'},{transform:'scaleY(1.42)',offset:.4},
                  {transform:'scaleY(1)'}], {duration:620, easing:'ease-out'});
    jouer('.b2', [{transform:'translateY(0)'},{transform:'translateY(2.5px)',offset:.4},
                  {transform:'translateY(0)'}], {duration:620, easing:'ease-out'});
    jouer('.y',  [{transform:'scaleY(1)'},{transform:'scaleY(.55)',offset:.35},
                  {transform:'scaleY(1)'}], {duration:520, easing:'ease-out'});
  } else if(cle === 'moyen'){
    jouer('.f', [{transform:'rotate(0deg)'},{transform:'rotate(-9deg)',offset:.28},
                 {transform:'rotate(7deg)',offset:.62},{transform:'rotate(0deg)'}],
          {duration:640, easing:'ease-in-out', composite:'add'});
    jouer('.b', [{transform:'translateX(0)'},{transform:'translateX(-2px)',offset:.3},
                 {transform:'translateX(2px)',offset:.65},{transform:'translateX(0)'}],
          {duration:640, easing:'ease-in-out'});
  } else {
    jouer('.l1,.l2', [{transform:'translateY(-4px) scale(.5)', opacity:.2},
                      {transform:'translateY(0) scale(1)', opacity:1, offset:.45},
                      {transform:'translateY(9px) scale(1.05)', opacity:1}],
          {duration:900, easing:'ease-in'});
    jouer('.b', [{transform:'scaleY(1)'},{transform:'scaleY(1.3)',offset:.45},
                 {transform:'scaleY(1)'}], {duration:760, easing:'ease-in-out'});
  }
}

const bouton = document.getElementById('hautParleur');
const stitre = document.getElementById('soustitre');
let lecteurs = {}, clipEnCours = 'accueil', dejaParle = false, minuterie = null;

bouton.title = CFG.textes.voixTitre;                 // pas la phrase : le clic
bouton.setAttribute('aria-label', CFG.textes.voixTitre);
bouton.innerHTML =
  '<svg viewBox="0 0 24 24" aria-hidden="true">'
  + '<path d="M3 9v6h4l5 4V5L7 9H3z"/>'
  + '<path class="onde" d="M16.5 8.5a5 5 0 0 1 0 7 1 1 0 0 0 1.4 1.4 7 7 0 0 0 0-9.8 1 1 0 1 0-1.4 1.4z"/>'
  + '</svg>';

const aDuSon = c => CLIPS[c] && CLIPS[c].src.indexOf('data:audio') === 0;

function lecteur(cle){
  if(lecteurs[cle]) return lecteurs[cle];
  if(!aDuSon(cle)) return null;
  // Un vrai element <audio> dans le document : le navigateur le precharge,
  // et certains contextes refusent de jouer un Audio() detache.
  const a = document.createElement('audio');
  a.preload = 'auto'; a.src = CLIPS[cle].src; a.style.display = 'none';
  document.body.appendChild(a);
  a.addEventListener('play',  () => {
    bouton.classList.add('parle');
    bouton.classList.remove('muet');
    stitre.classList.remove('bloque');
    bouton.title = CFG.textes.voixTitre;
  });
  a.addEventListener('pause', () => bouton.classList.remove('parle'));
  a.addEventListener('ended', () => { bouton.classList.remove('parle'); cacheApres(1800); });
  a.addEventListener('error', () => plainte('lecture impossible'));
  lecteurs[cle] = a;
  return a;
}

function montreSousTitre(cle){
  const t = CLIPS[cle] && CLIPS[cle].texte;
  if(!t) return;
  clearTimeout(minuterie);
  stitre.querySelector('.dit').textContent = t;
  stitre.classList.add('vu');
}
function cacheApres(ms){
  clearTimeout(minuterie);
  minuterie = setTimeout(() => stitre.classList.remove('vu'), ms);
}

/* Un echec muet est le pire des cas : personne ne sait s'il faut monter le
   volume ou signaler un bogue. On l'affiche, et le sous-titre reste. */
function plainte(quoi){
  bouton.classList.remove('parle');
  bouton.classList.add('muet');
  bouton.title = CFG.textes.voixEchec + ' (' + quoi + ')';
  stitre.querySelector('.alerte').textContent = CFG.textes.voixBloquee;
  stitre.classList.add('bloque');
  montreSousTitre(clipEnCours);
  cacheApres(14000);          // on laisse le temps de lire les deux
}

function parle(cle){
  const a = lecteur(cle);
  if(!a) return;
  Object.keys(lecteurs).forEach(k => { if(k !== cle) lecteurs[k].pause(); });
  clipEnCours = cle;
  montreSousTitre(cle);
  try { if(a.readyState > 0) a.currentTime = 0; } catch(e){}
  let p;
  try { p = a.play(); } catch(e){ plainte(e.name); return; }
  if(p && p.catch) p.catch(e => plainte(e.name));
}

bouton.onclick = () => {
  const a = lecteur(clipEnCours);
  if(!a) return;
  dejaParle = true;
  if(!a.paused){ a.pause(); cacheApres(400); return; }   // deuxieme clic : on coupe
  parle(clipEnCours);
};

/* premier geste de l'eleve dans l'activite */
function premierGeste(){
  if(dejaParle) return;
  dejaParle = true;
  parle('accueil');
}
if(!aDuSon('accueil') && !aDuSon('bilan')) bouton.style.display = 'none';

/* ---------- la carte a emporter ---------------------------------------
   Dessinee sur un canvas, dans la page, sans aucune bibliotheque. Les
   visages sont retraces au trait plutot que rasterises depuis le SVG : une
   image SVG posee sur un canvas « salit » celui-ci sur certains navigateurs
   et l'enregistrement echouerait.                                        */
function dessineVisage(x, cx, cy, r, cle){
  const u = r / 46;                       // le SVG tient dans un rayon de 46
  const P = (vx, vy) => [cx + (vx - 50) * u, cy + (vy - 50) * u];
  x.save();
  x.fillStyle = '#f6c544'; x.strokeStyle = '#dfa71f'; x.lineWidth = 2.5 * u;
  x.beginPath(); x.arc(cx, cy, r, 0, Math.PI * 2); x.fill(); x.stroke();
  x.fillStyle = '#5a4412'; x.strokeStyle = '#5a4412'; x.lineCap = 'round';

  if(cle === 'moyen'){
    [[35,43],[65,43]].forEach(([a,b]) => {
      const [px,py] = P(a,b);
      x.beginPath(); x.arc(px, py, 5.6*u, 0, Math.PI*2); x.fill(); });
    x.lineWidth = 5.6*u;
    const [x1,y1] = P(34,71), [x2,y2] = P(66,71);
    x.beginPath(); x.moveTo(x1,y1); x.lineTo(x2,y2); x.stroke();

  } else if(cle === 'bien'){
    [[34,40],[66,40]].forEach(([a,b]) => {
      const [px,py] = P(a,b);
      x.beginPath(); x.arc(px, py, 5.8*u, 0, Math.PI*2); x.fill(); });
    const [mx,my] = P(50,57);
    x.beginPath(); x.arc(mx, my, 23*u, 0, Math.PI); x.closePath(); x.fill();
    x.fillStyle = '#ef6a8d';
    const [tx,ty] = P(50,74);
    x.beginPath(); x.ellipse(tx, ty, 15*u, 9*u, 0, 0, Math.PI); x.fill();

  } else {
    x.lineWidth = 5.4*u;                  // yeux fermes, deux arcs
    [[25,43],[57,75]].forEach(([a,b]) => {
      const [x1,y1] = P(a,41), [x2,y2] = P(b,41), [qx,qy] = P((a+b)/2, 30);
      x.beginPath(); x.moveTo(x1,y1); x.quadraticCurveTo(qx,qy,x2,y2); x.stroke(); });
    const [mx,my] = P(50,72);
    x.beginPath(); x.ellipse(mx, my, 15*u, 12*u, 0, 0, Math.PI*2); x.fill();
    x.fillStyle = '#4ec3e9';              // deux larmes
    [[29,60],[71,60]].forEach(([a,b]) => {
      const [px,py] = P(a,b);
      x.beginPath(); x.ellipse(px, py, 6*u, 11*u, 0, 0, Math.PI*2); x.fill(); });
  }
  x.restore();
}

function coche(x, cx, cy, t){
  x.save();
  x.strokeStyle = '#43c04a'; x.lineWidth = t*0.30;
  x.lineCap = 'round'; x.lineJoin = 'round';
  x.beginPath();
  x.moveTo(cx - t*0.42, cy);
  x.lineTo(cx - t*0.10, cy + t*0.34);
  x.lineTo(cx + t*0.46, cy - t*0.40);
  x.stroke(); x.restore();
}

function gelule(x, gx, gy, texte, fond){
  x.save();
  x.font = '800 22px Montserrat, sans-serif';
  const l = x.measureText(texte).width + 42, h = 44;
  x.fillStyle = fond;
  x.beginPath(); x.roundRect(gx, gy, l, h, 22); x.fill();
  x.fillStyle = '#fff'; x.textBaseline = 'middle';
  x.fillText(texte, gx + 21, gy + h/2 + 1);
  x.restore();
  return h;
}

function fabriqueCarte(forts, leviers){
  const c = CFG.couleurs, T = CFG.textes;
  const lignes = etat.filter(l => l.n && (!l.libre || l.nom));
  const H = 250 + (forts.length   ? 56 + forts.length   * 62 : 0)
                + (leviers.length ? 56 + leviers.length * 62 : 0)
                + 96 + lignes.length * 74 + 124;
  const cv = document.createElement('canvas');
  cv.width = 1200; cv.height = H;
  const x = cv.getContext('2d');
  x.textBaseline = 'alphabetic';

  x.fillStyle = '#eef4fa'; x.fillRect(0, 0, 1200, H);
  x.fillStyle = c.teal;    x.fillRect(0, 0, 1200, 200);
  x.fillStyle = '#fff';
  x.font = '800 56px Montserrat, sans-serif';
  x.fillText(T.carteTitre, 70, 104);
  x.font = '600 25px Montserrat, sans-serif';
  x.fillStyle = 'rgba(255,255,255,.88)';
  x.fillText(T.carteSous, 70, 150);

  let y = 262;
  const bloc = (titre, noms, teinte) => {
    if(!noms.length) return;
    y += gelule(x, 70, y, titre, teinte) + 14;
    noms.forEach(n => {
      x.fillStyle = teinte;
      x.beginPath(); x.arc(88, y + 20, 8, 0, Math.PI*2); x.fill();
      x.fillStyle = '#083a45';
      x.font = '700 38px Montserrat, sans-serif';
      x.textBaseline = 'middle';
      x.fillText(n, 116, y + 22);
      x.textBaseline = 'alphabetic';
      y += 62;
    });
    y += 20;
  };
  bloc(T.carteForts,   forts,   c.teal);
  bloc(T.carteLeviers, leviers, c.rose);

  y += 14;
  x.strokeStyle = '#c9dbe4'; x.lineWidth = 2;
  x.beginPath(); x.moveTo(70, y); x.lineTo(1130, y); x.stroke();
  y += 46;
  x.fillStyle = '#4a6b76'; x.font = '800 21px Montserrat, sans-serif';
  x.fillText(T.carteTableau.toUpperCase(), 70, y);
  y += 26;

  lignes.forEach((l, i) => {
    if(i % 2 === 0){ x.fillStyle = '#e4edf4'; x.fillRect(70, y, 1060, 74); }
    x.fillStyle = '#083a45'; x.font = '600 29px Montserrat, sans-serif';
    x.textBaseline = 'middle';
    x.fillText(l.nom, 96, y + 38);
    x.textBaseline = 'alphabetic';
    if(l.aime) coche(x, 860, y + 37, 46);
    dessineVisage(x, 1040, y + 37, 27, l.n);
    y += 74;
  });

  x.fillStyle = '#7d94a0'; x.font = '600 21px Montserrat, sans-serif';
  x.textAlign = 'center';
  x.fillText(T.cartePied, 600, H - 46);
  return cv;
}

let carteURL = null;
async function faisLaCarte(){
  const forts = [], leviers = [];
  etat.forEach(l => {
    if(!l.aime || !l.n || (l.libre && !l.nom)) return;
    (l.n === 'bien' ? forts : leviers).push(l.nom);
  });
  if(document.fonts && document.fonts.ready) await document.fonts.ready;
  const cv = fabriqueCarte(forts, leviers);
  const donnees = cv.toDataURL('image/png');
  const blob = await new Promise(res => cv.toBlob(b => res(b), 'image/png'));
  return { blob: blob, donnees: donnees };
}

async function telechargeCarte(){
  const { blob, donnees } = await faisLaCarte();

  // Le telechargement passe par une URL temporaire : c'est ce que les
  // navigateurs acceptent le mieux pour un fichier de cette taille.
  if(carteURL) URL.revokeObjectURL(carteURL);
  carteURL = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = carteURL; a.download = CFG.textes.carteFichier;
  document.body.appendChild(a); a.click(); a.remove();

  // L'apercu, lui, prend l'image en clair. Une URL temporaire porte une
  // origine « null » quand la page vient d'un fichier local ou d'un cadre
  // restreint, et plusieurs navigateurs refusent alors de l'afficher.
  const img = document.getElementById('apercuCarte');
  img.src = donnees;

  const mot = document.getElementById('motCarte');
  mot.querySelector('span').textContent = CFG.textes.carteMot;
  mot.classList.add('vu');
}

/* ---------- confettis -------------------------------------------------
   Des rectangles, pas des images : rien a charger, et la couleur suit la
   charte. Chacun part d'une abscisse au hasard, derive, tourne sur
   lui-meme et disparait. Ils se retirent du document en fin de course. */
function confettis(n){
  if(doux || CFG.options && CFG.options.confettis === false) return;
  const st = document.getElementById('stage');
  const c  = CFG.couleurs;
  const teintes = [c.rose, c.teal, '#f6c544', c.violet, '#ffffff', '#43c04a'];
  for(let i = 0; i < n; i++){
    const d = document.createElement('div');
    d.className = 'conf';
    d.style.left       = (50 + Math.random()*1500) + 'px';
    d.style.width      = (7 + Math.random()*8) + 'px';
    d.style.height     = (10 + Math.random()*13) + 'px';
    d.style.background = teintes[i % teintes.length];
    st.appendChild(d);
    const derive = (Math.random() - .5) * 300;
    const tour   = 360 * (2 + Math.random()*4);
    const a = d.animate([
      {transform:'translate(0,0) rotate(0deg)', opacity:1},
      {transform:`translate(${derive*.35}px,420px) rotate(${tour*.45}deg)`,
       opacity:1, offset:.55},
      {transform:`translate(${derive}px,1000px) rotate(${tour}deg)`, opacity:0}
    ], {duration: 2300 + Math.random()*1700, delay: Math.random()*500,
        easing:'cubic-bezier(.25,.6,.5,1)'});
    a.onfinish = () => d.remove();
  }
}

/* ---------- bulle qui s'adapte au texte ---------- */
function dit(el, html, maxh){
  el.innerHTML = html;
  let c = el.id === 'exBulle' ? 20 : 24;
  el.style.fontSize = c+'px';
  let garde = 0;
  while(el.offsetHeight > maxh && c > 14 && garde++ < 40){
    c -= 1; el.style.fontSize = c+'px';
  }
}
/* La bulle est ancree par le bas et grandit vers le haut. Sa base est a
   252 px du haut du cadre : au-dela de 224 px de hauteur elle sortirait
   de l'ecran. Le texte se resserre plutot que de deborder. */
const MAXH = 224, MAXH_EX = 210;

/* ---------- construction du tableau ---------- */
function celluleMoyenne(i, lecture){
  const d = document.createElement('div');
  d.className = 'moy';
  CFG.niveaux.forEach(nv => {
    const b = document.createElement('button');
    b.className = 'sm'; b.dataset.n = nv.cle; b.type = 'button';
    b.title = nv.label;
    b.setAttribute('aria-label', nv.label);
    b.innerHTML = VISAGES[nv.cle];
    if(!lecture) b.onclick = () => { poseMoyenne(i, nv.cle); expression(b, nv.cle); };
    d.appendChild(b);
  });
  return d;
}

function batitTableau(){
  $('#tTitre').textContent  = CFG.titre;
  $('#tQuestion').textContent = CFG.question;
  $('#thMat').textContent  = CFG.entetes.matiere;
  $('#thAime').textContent = CFG.entetes.aime;
  $('#thMoy').textContent  = CFG.entetes.moyenne;
  $('#exLabel').textContent = CFG.textes.exBouton;
  $('#btnRejouer').textContent = CFG.textes.rejouer;
  $('#btnValider').textContent = CFG.textes.valider;
  $('#btnCarte').textContent   = CFG.textes.carte;
  $('#voirCarte').textContent  = CFG.textes.carteVoir;
  $('#aideCarte').textContent  = CFG.textes.carteAide;

  corps.innerHTML = '';
  etat = [];
  const lignes = CFG.matieres.slice();
  lignes.forEach((nom,i) => ajouteLigne(nom, i, false));
  if(CFG.ligneLibre) ajouteLigne('', lignes.length, true);

  // légende sous le tableau
  const lg = $('#legende');
  lg.innerHTML = '<span class="tt">' + CFG.textes.legende + '</span>'
    + CFG.niveaux.map(nv =>
        `<span class="item">${VISAGES[nv.cle]}<span>${nv.label}</span></span>`).join('');
}

function ajouteLigne(nom, i, libre){
  etat.push({ nom: nom, aime: false, n: null, libre: libre });
  const tr = document.createElement('tr');
  tr.dataset.i = i;

  const tdNom = document.createElement('td');
  tdNom.className = 'nom' + (libre ? ' libre' : '');
  if(libre){
    const inp = document.createElement('input');
    inp.type = 'text'; inp.placeholder = CFG.libreInvite; inp.maxLength = 28;
    inp.oninput = () => { etat[i].nom = inp.value.trim(); verifie(); };
    tdNom.appendChild(inp);
  } else {
    tdNom.textContent = nom;
  }

  const tdAime = document.createElement('td');
  tdAime.className = 'cell-aime';
  const c = document.createElement('span');
  c.className = 'case'; c.tabIndex = 0; c.setAttribute('role','checkbox');
  c.setAttribute('aria-checked','false');
  c.innerHTML = COCHE;
  const bascule = () => {
    etat[i].aime = !etat[i].aime;
    c.classList.toggle('coche', etat[i].aime);
    c.setAttribute('aria-checked', etat[i].aime ? 'true' : 'false');
    premierGeste(); reagit(); verifie();
  };
  c.onclick = bascule;
  c.onkeydown = e => { if(e.key===' '||e.key==='Enter'){ e.preventDefault(); bascule(); } };
  tdAime.appendChild(c);

  const tdMoy = document.createElement('td');
  tdMoy.className = 'cell-moy';
  tdMoy.appendChild(celluleMoyenne(i, false));

  tr.append(tdNom, tdAime, tdMoy);
  corps.appendChild(tr);
}

/* Lisa ne repond pas la meme chose selon ce qu'on lui dit : approbation
   franche pour « je reussis bien », simple accuse de reception pour
   « ca va », et une inclinaison lente, compatissante, pour « j'ai du mal ». */
function reagitAu(cle){
  if(cle === 'bien'){ hoche(1.45); epaules(); return; }
  if(cle === 'moyen'){ hoche(.8); return; }
  const t = couche('.tete');
  if(t && !doux) t.animate(
    [{transform:'rotate(0deg)'},
     {transform:'rotate(1.7deg)', offset:.35},
     {transform:'rotate(1.4deg)', offset:.62},
     {transform:'rotate(0deg)'}],
    {duration:1250, easing:'ease-in-out', composite:'add'});
}

function poseMoyenne(i, cle){
  etat[i].n = cle;
  const tr = corps.querySelector(`tr[data-i="${i}"]`);
  const moy = tr.querySelector('.moy');
  moy.classList.add('repondu');
  moy.querySelectorAll('.sm').forEach(b =>
    b.classList.toggle('pris', b.dataset.n === cle));
  premierGeste(); reagitAu(cle); verifie();
}

/* ---------- bilan ------------------------------------------------------
   Deux groupes seulement, ce sont les deux qui servent pour un dossier :
   ce qu'on aime et qu'on réussit, ce qu'on aime sans y arriver encore. */
function liste(noms){
  if(noms.length === 1) return '<b>'+noms[0]+'</b>';
  return noms.slice(0,-1).map(n=>'<b>'+n+'</b>').join(', ')
       + ' et <b>' + noms[noms.length-1] + '</b>';
}

/* Une ligne remplie perd aussitot sa marque orange : la correction se voit
   pendant qu'on corrige, pas au prochain clic sur « J'ai termine ». */
function verifie(){
  etat.forEach((l,i) => {
    if(!l.n) return;
    const tr = corps.querySelector(`tr[data-i="${i}"]`);
    if(tr) tr.classList.remove('manque','secoue');
  });
  $('#btnValider').classList.toggle('pret', manquantes().length === 0);
  // Si l'eleve change d'avis apres coup, le bilan affiche n'est plus le sien :
  // on efface les marques et on lui redonne la main sur « J'ai termine ».
  if(corps.querySelector('tr.fort, tr.levier')) rendLaMain();
}

function rendLaMain(){
  $('#btnValider').classList.remove('range');
  corps.querySelectorAll('tr').forEach(tr => tr.classList.remove('fort','levier'));
  corps.querySelectorAll('.etiq').forEach(e => e.remove());
  $('#btnCarte').classList.remove('vu');
  $('#btnRejouer').classList.remove('vu');
  $('#motCarte').classList.remove('vu');
}

function manquantes(){
  return etat.map((l,i) => (!l.libre && !l.n) ? i : -1).filter(i => i >= 0);
}

function valide(){
  const trous = manquantes();
  corps.querySelectorAll('tr').forEach(tr =>
    tr.classList.remove('fort','levier','manque','secoue'));
  corps.querySelectorAll('.etiq').forEach(e => e.remove());

  if(trous.length){
    trous.forEach(i => {
      const tr = corps.querySelector(`tr[data-i="${i}"]`);
      tr.classList.add('manque','secoue');
      setTimeout(() => tr.classList.remove('secoue'), 500);
    });
    const n = trous.length === 1 ? 'une matière' : trous.length + ' matières';
    montre('reprise');
    dit(bulle, CFG.textes.manque.replace('{n}', '<b>'+n+'</b>'), MAXH);
    hoche(1.1);
    rendLaMain();
    return;
  }
  bilan();
}

function bilan(){
  const forts = [], leviers = [];
  let rang = 0;
  etat.forEach((l,i) => {
    if(!l.aime || !l.n) return;
    if(l.libre && !l.nom) return;
    const tr = corps.querySelector(`tr[data-i="${i}"]`);
    const fort = l.n === 'bien';
    (fort ? forts : leviers).push(l.nom);
    tr.classList.add(fort ? 'fort' : 'levier');
    // etiquette : le bilan se lit dans le tableau, pas seulement dans la bulle
    const nom = tr.querySelector('td.nom');
    nom.querySelectorAll('.etiq').forEach(e => e.remove());
    const et = document.createElement('span');
    et.className = 'etiq ' + (fort ? 'f' : 'l');
    et.textContent = fort ? CFG.textes.etiqFort : CFG.textes.etiqLevier;
    nom.appendChild(et);
    setTimeout(() => et.classList.add('vu'), 260 + (rang++) * 130);
  });

  let txt;
  if(!forts.length && !leviers.length){
    txt = CFG.textes.bilanRien;
  } else {
    const bouts = [];
    if(forts.length)   bouts.push(CFG.textes.bilanForts.replace('{forts}', liste(forts)));
    if(leviers.length) bouts.push(CFG.textes.bilanLeviers.replace('{leviers}', liste(leviers)));
    txt = bouts.join(' ');
  }
  montre('bilan');
  dit(bulle, txt, MAXH);
  hoche(1.3);
  confettis(120);
  parle('bilan');
  $('#btnValider').classList.remove('pret');
  $('#btnValider').classList.add('range');
  $('#btnCarte').classList.add('vu');
  $('#btnRejouer').classList.add('vu');
}
$('#btnValider').onclick = valide;
$('#btnCarte').onclick   = telechargeCarte;
$('#voirCarte').onclick  = () => $('#voileCarte').classList.add('vu');
$('#fermerCarte').onclick = () => $('#voileCarte').classList.remove('vu');
$('#voileCarte').onclick = e => {

/* ---------- mise à l'échelle ---------- */
function ajuste(){
  const k = Math.min(innerWidth/1600, innerHeight/900);
  const st = $('#stage'), cd = $('#cadre');
  st.style.transform = `scale(${k})`;
  cd.style.width  = (1600*k)+'px';
  cd.style.height = (900*k)+'px';
}
