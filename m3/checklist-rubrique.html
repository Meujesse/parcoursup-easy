<!doctype html><html lang="fr"><head><meta charset="utf-8"><title>Checklist – Activités et centres d’intérêt</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
:root{--canard:#0e5d70;--rose:#ea1f5c;--encre:#1f3a45;--papier:#fffdf7}
body{margin:0;background:#6fb3c3;font-family:Montserrat,sans-serif;color:var(--encre)}
#f{max-width:760px;margin:30px auto;background:var(--papier);border-radius:16px;padding:34px 44px 30px 60px;position:relative}
#f:before{content:"";position:absolute;left:38px;top:0;bottom:0;width:2px;background:#f4b3c6}
h1{margin:0;font:400 34px/1.1 'Patrick Hand',cursive;color:var(--rose)}
.st{font:400 19px 'Patrick Hand',cursive;color:#6a8791;margin:6px 0 18px}
label{display:flex;gap:14px;align-items:center;font:400 24px/48px 'Patrick Hand',cursive;border-bottom:2px solid #e3d6d6;cursor:pointer}
label b{font-weight:400;color:var(--canard);min-width:26px}
input{width:22px;height:22px;accent-color:var(--rose)}
.btn{border:0;border-radius:999px;background:var(--rose);color:#fff;font:700 15px Montserrat,sans-serif;padding:11px 20px;cursor:pointer;margin-top:22px}
.pied{font:400 15px 'Patrick Hand',cursive;color:var(--canard);opacity:.6;text-align:right;margin-top:14px}
@media print{body{background:#fff}#f{margin:0;max-width:none}.btn{display:none}}
</style></head><body><div id="f">
<h1>✅ Comment remplir Activités et centres d’intérêt ?</h1>
<div class="st">Ma checklist · Parcoursup'easy · Mission 3</div>
<label><input type="checkbox"><b>1.</b> Je repère les catégories de la rubrique.</label>
<label><input type="checkbox"><b>2.</b> Je sélectionne les expériences pertinentes.</label>
<label><input type="checkbox"><b>3.</b> Je décris des faits concrets.</label>
<label><input type="checkbox"><b>4.</b> Je valorise mes apprentissages.</label>
<label><input type="checkbox"><b>5.</b> Je relis pour vérifier la clarté et l’exactitude.</label>
<button class="btn" onclick="window.print()">📥 Télécharger / imprimer ma checklist</button>
<div class="pied">Parcoursup'easy · Carnet de route</div>
</div></body></html>
