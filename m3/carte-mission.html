<!doctype html><html lang="fr"><head><meta charset="utf-8"><title>Ma carte de mission – Mission 3</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=Patrick+Hand&display=swap" rel="stylesheet">
<link rel="stylesheet" href="commun.css"><style>
#s{background:#6fb3c3 url(img/montagne.jpg) center/cover no-repeat}
#voile{position:absolute;inset:0;background:linear-gradient(180deg,rgba(111,179,195,.15),rgba(111,179,195,0) 35%,rgba(111,179,195,.25))}
#tete{position:absolute;left:36px;top:22px;width:760px}
#tete h1{font-size:34px}
#tete .sous{font-size:15px;margin-top:4px}
svg{position:absolute;left:0;top:0;width:1200px;height:675px}
.chemin{fill:none;stroke:#fffdf7;stroke-width:5;stroke-dasharray:2 14;stroke-linecap:round;opacity:.9}
.chemin.fait{stroke:#ea1f5c;stroke-dasharray:none;opacity:1}
.jalon{cursor:pointer}
.jalon circle.d{fill:#fff;stroke:#0e5d70;stroke-width:4}
.jalon text.n{font:800 20px Montserrat,sans-serif;fill:#0e5d70;text-anchor:middle;dominant-baseline:central}
.jalon .lab{font:700 15px Montserrat,sans-serif;fill:#0e5d70;text-anchor:middle;dominant-baseline:central}
.jalon .pill{fill:#fffdf7}
.jalon.fait circle.d{fill:#ea1f5c;stroke:#fff}
.jalon.fait text.n{fill:#fff}
.jalon.actif circle.d{fill:#ea1f5c;stroke:#fff}
.jalon.actif text.n{fill:#fff}
.jalon.actif circle.halo{fill:none;stroke:#ea1f5c;stroke-width:4;opacity:.7;animation:pulse 1.6s ease-out infinite;transform-origin:center;transform-box:fill-box}
.jalon.verrou{cursor:not-allowed}
.jalon.verrou circle.d{fill:#d7e6ea;stroke:#8fb1bb}
.jalon.verrou text.n{fill:#8fb1bb}
.jalon.verrou .lab,.jalon.verrou .pill{opacity:.8}
.jalon.secoue{animation:shake .4s}
@keyframes pulse{0%{transform:scale(1);opacity:.8}100%{transform:scale(1.9);opacity:0}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
#lisa{right:10px;height:380px}
#bulle{right:30px;top:72px;max-width:270px;font-size:14px;padding:10px 14px}
#bulle:after{display:none}
#etape{position:absolute;left:300px;top:380px;background:rgba(255,253,247,.92);border-radius:14px;padding:10px 16px;font:600 14px/1.3 Montserrat,sans-serif;color:var(--encre);max-width:470px}
#etape b{color:var(--rose)}
body.compact #lisa,body.compact #bulle,body.compact #etape{display:none!important}
</style></head><body><div id="s"><div id="voile"></div>
<div id="tete"><h1>🗺️ Ma carte de mission</h1><div class="sous">Cinq étapes pour construire ton dossier. Chaque étape terminée débloque la suivante.</div></div>
<svg viewBox="0 0 1200 675" id="carte"></svg>
<div id="etape"></div>
<img class="lisa" id="lisa" alt=""><div class="bulle" id="bulle"></div>
</div>
<script>if(new URLSearchParams(location.search).get('mode')==='compact'){document.body.classList.add('compact');}</script><script src="commun.js"></script><script>
const Z=[
 {n:1,e:'🕵️',t:"Je repère les pièges",d:"Je comprends ce qui rend un dossier précis, cohérent et personnel.",x:130,y:510,slide:'02b18949-793e-48c8-9fa0-164f9f426bf8'},
 {n:2,e:'🌟',t:"Je valorise mon parcours",d:"J'identifie mes expériences et je les décris concrètement.",x:320,y:430,slide:'cf8ae685-804a-4673-9cfb-62d140c0ae7a'},
 {n:3,e:'✍️',t:"J'écris mes lettres",d:"Je rédige une lettre personnelle, argumentée et adaptée.",x:500,y:460,slide:'dba6c1c1-b66e-4ce9-b8b6-f0147895fa91'},
 {n:4,e:'✅',t:"Je vérifie mon dossier",d:"Je contrôle mes rubriques et mes pièces avant les échéances.",x:660,y:340,slide:'47a3acc0-f04f-440f-809f-629ab0416846'},
 {n:5,e:'🏆',t:"Je relève le challenge final",d:"Je termine la mission.",x:800,y:200,slide:'53b4d010-93fb-4ee0-a9f8-b0ba59986aeb'}
];
const svg=document.getElementById('carte'); const NS='http://www.w3.org/2000/svg';
function el(t,a,txt){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(txt!=null)e.textContent=txt;return e;}
const ETAPE=+(new URLSearchParams(location.search).get('etape')||0);
if(ETAPE){ for(let i=1;i<ETAPE;i++) PE.zoneDone(i); }
function render(){
 const done=ETAPE?Z.filter(z=>z.n<ETAPE).map(z=>z.n):PE.zones().done; const cur=Z.find(z=>done.indexOf(z.n)<0); svg.innerHTML='';
 for(let i=0;i<Z.length-1;i++){const a=Z[i],b=Z[i+1]; const mx=(a.x+b.x)/2; const p=el('path',{d:`M${a.x} ${a.y} C ${mx} ${a.y}, ${mx} ${b.y}, ${b.x} ${b.y}`,class:'chemin'+(done.indexOf(a.n)>=0?' fait':'')}); svg.appendChild(p);}
 Z.forEach(z=>{ const st=done.indexOf(z.n)>=0?'fait':(cur&&cur.n===z.n?'actif':'verrou');
  const g=el('g',{class:'jalon '+st,'data-n':z.n});
  if(st==='actif') g.appendChild(el('circle',{class:'halo',cx:z.x,cy:z.y,r:26}));
  g.appendChild(el('circle',{class:'d',cx:z.x,cy:z.y,r:26}));
  g.appendChild(el('text',{class:'n',x:z.x,y:z.y},st==='fait'?'✓':(st==='verrou'?'🔒':String(z.n))));
  const lab=el('text',{class:'lab',x:z.x,y:z.y+48},z.e+' '+z.t); g.appendChild(lab);
  g.onclick=()=>{ if(st==='verrou'){ g.classList.remove('secoue'); void g.getBBox(); g.classList.add('secoue'); bulle("Patience ! Termine d'abord l'étape "+(z.n-1)+" : « "+Z[z.n-2].t+" »."); return; } PE.goSlide(z.slide); };
  svg.appendChild(g); try{ const b=lab.getBBox(); const pill=el('rect',{class:'pill',x:b.x-10,y:b.y-4,width:b.width+20,height:b.height+8,rx:(b.height+8)/2}); g.insertBefore(pill,lab); }catch(e){} });
 const et=document.getElementById('etape');
 if(cur){ et.innerHTML='<b>Étape '+cur.n+' sur 5 · '+cur.e+' '+cur.t+'</b><br>'+cur.d+(done.length?' <span style="opacity:.7">· '+done.length+' étape'+(done.length>1?'s':'')+' déjà franchie'+(done.length>1?'s':'')+'</span>':''); }
 else { et.innerHTML='<b>🏆 Sommet atteint !</b><br>Les cinq étapes sont terminées. Tu peux revenir sur n’importe laquelle.'; }
 const ref=cur||Z[6]; et.style.left=Math.max(16,Math.min(700,ref.x-30))+'px'; et.style.top=Math.max(60,ref.y-118)+'px';
 const lisa=document.getElementById('lisa');
 if(!done.length){ lisa.src=LISA+'lisa_02_presentation.gif'; bulle("Pour réussir cette mission, tu vas franchir 5 étapes. On commence par « Je repère les pièges » !"); }
 else if(cur){ lisa.src=LISA+'lisa_19_pouce-leve.gif'; bulle("Bien joué, étape "+(cur.n-1)+" terminée ! On passe à « "+cur.t+" ». Continue avec la flèche ➜"); }
 else { lisa.src=LISA+'lisa_26_emerveillement.gif'; bulle("Bravo, les cinq étapes sont franchies. Ton dossier est presque prêt !"); }
}
function bulle(t){document.getElementById('bulle').textContent=t;}
render(); addEventListener('storage',render);
</script></body></html>
