<!doctype html><html lang="fr"><head><meta charset="utf-8"><title>Ma lettre bloc par bloc</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=Patrick+Hand&display=swap" rel="stylesheet">
<link rel="stylesheet" href="commun.css"><style>
html,body{background:transparent}
#etapes{position:absolute;left:40px;top:136px;width:1120px;display:flex;gap:10px}
#etapes span{flex:1;height:46px;border-radius:12px;background:rgba(255,255,255,.25);color:#fff;font:700 15px/46px Montserrat,sans-serif;text-align:center;cursor:pointer}
#etapes span.on{background:#fff;color:var(--canard)}
#etapes span.fait:after{content:" ✓"}
#defi{position:absolute;left:40px;top:196px;width:1120px;height:400px;background:var(--papier);border-radius:18px;padding:22px 30px;box-sizing:border-box;display:flex;gap:28px}
#gauche{flex:0 0 470px}
#gauche h2{margin:0 0 10px;font:800 22px Montserrat,sans-serif;color:var(--rose)}
.bloc{border-radius:12px;padding:10px 14px;margin-bottom:10px;font:500 16px/1.4 Montserrat,sans-serif}
.bloc b{display:block;font:800 13px Montserrat,sans-serif;letter-spacing:.04em;margin-bottom:3px}
.consigne{background:#e7f3f6;color:var(--canard)}
.aide{background:#fff3d6;color:#7a4a00}
.attendu{background:#d6f5e8;color:#0f5c47}
#droite{flex:1;display:flex;flex-direction:column}
#droite label{font:400 21px 'Patrick Hand',cursive;color:var(--canard);margin-bottom:4px}
textarea{flex:1;resize:none;border:0;outline:none;background:repeating-linear-gradient(transparent 0 33px,#d9caca 33px 34px);font:400 22px/34px 'Patrick Hand',cursive;color:var(--encre);padding:0 6px}
#note{font:400 16px/1.3 'Patrick Hand',cursive;color:#8a4b00;margin-top:6px}
#nav{position:absolute;left:40px;top:606px;display:flex;gap:10px}
#nav .btn{box-shadow:none;font-size:15px;padding:10px 18px}
#nav .btn.sec{border:2px solid #fff}
</style></head><body><div id="s">
<div id="etapes"></div>
<div id="defi"><div id="gauche"></div><div id="droite"><label>Mon brouillon</label><textarea id="brouillon" placeholder="Écris ici tes idées…"></textarea><div id="note">⚠️ Ces champs sont un guide. Rédige ta lettre complète dans un document personnel, conserve-la, puis copie-la sur la plateforme Parcoursup.</div></div></div>
<div id="nav"><button class="btn sec" id="prev">◀ Défi précédent</button><button class="btn" id="next">Défi suivant ▶</button></div>
</div>
<script src="commun.js"></script><script>
(function(){
 // Contenu : document de Laurence, mission 3, écran 19
 var D=[['Mon intérêt','Sélectionne 2 éléments qui expliquent ton intérêt pour cette formation.','Tu peux t’appuyer sur les matières, le programme, un projet ou une expérience.','2 arguments notés dans la fiche personnelle.'],
  ['Mes acquis','Choisis une expérience ou un acquis qui éclaire ton intérêt.','Pense à un cours, un projet, un stage, une activité ou une démarche personnelle.','Un exemple précis, sans exagération.'],
  ['Mon lien avec la formation','Explique ce que tu souhaites approfondir dans cette formation.','Fais le lien entre ton intérêt, ton parcours et les enseignements proposés.','Une phrase personnalisée.'],
  ['Ma conclusion','Termine ta lettre avec une formule simple et adaptée.','Reste poli et naturel. Évite les promesses de réussite ou les demandes insistantes.','Une conclusion sobre.']];
 var i=0, vu={0:1}, txt=['','','',''];
 var et=document.getElementById('etapes'), g=document.getElementById('gauche'), ta=document.getElementById('brouillon');
 function paint(){ et.innerHTML=D.map(function(d,k){ return '<span class="'+(k===i?'on ':'')+(vu[k]&&k!==i?'fait':'')+'" data-k="'+k+'">Micro-défi '+(k+1)+'</span>'; }).join('');
  [].forEach.call(et.children,function(sp){ sp.onclick=function(){ aller(+sp.dataset.k); }; });
  var d=D[i]; g.innerHTML='<h2>Micro-défi '+(i+1)+' · '+d[0]+'</h2><div class="bloc consigne"><b>CONSIGNE</b>« '+d[1]+' »</div><div class="bloc aide"><b>💡 AIDE</b>« '+d[2]+' »</div><div class="bloc attendu"><b>🎯 RÉSULTAT ATTENDU</b>'+d[3]+'</div>';
  ta.value=txt[i]; document.getElementById('prev').disabled=i===0; document.getElementById('next').disabled=i===D.length-1; }
 function aller(k){ txt[i]=ta.value; i=k; vu[k]=1; paint(); }
 document.getElementById('next').onclick=function(){ if(i<D.length-1) aller(i+1); };
 document.getElementById('prev').onclick=function(){ if(i>0) aller(i-1); };
 paint();
})();
</script></body></html>
